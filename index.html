<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>吵架擂台 · 真AI裁判 (DeepSeek)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        .app {
            max-width: 600px;
            margin: 0 auto;
            background-color: #000000;
            min-height: 100vh;
            color: #e7e7e7;
            padding-bottom: 80px;
        }

        .header {
            position: sticky;
            top: 0;
            background-color: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(12px);
            padding: 12px 20px;
            border-bottom: 0.5px solid #2c2c2c;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #ff4d4d, #ff9f4d);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .ai-badge {
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 700;
            color: white;
        }

        .create-btn-wrap {
            padding: 14px 20px 8px;
        }

        .create-btn {
            background: linear-gradient(135deg, #ff4d4d 0%, #ff7a45 100%);
            color: white;
            border: none;
            padding: 14px 18px;
            border-radius: 28px;
            font-weight: 700;
            width: 100%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .categories {
            padding: 12px 20px;
            display: flex;
            gap: 10px;
            overflow-x: auto;
            border-bottom: 0.5px solid #2c2c2c;
        }

        .cat-item {
            background: #1a1a1a;
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 14px;
            color: #b0b0b0;
            cursor: pointer;
        }

        .cat-item.active {
            background: #ffffff;
            color: #000000;
        }

        .tabs {
            display: flex;
            gap: 28px;
            padding: 12px 20px;
            border-bottom: 0.5px solid #2c2c2c;
        }

        .tab {
            font-size: 16px;
            font-weight: 600;
            color: #71767b;
            cursor: pointer;
            padding-bottom: 8px;
        }

        .tab.active {
            color: #ff7a45;
            border-bottom: 2px solid #ff7a45;
        }

        .card {
            background-color: #121212;
            margin: 14px 20px;
            border-radius: 28px;
            padding: 18px;
            border: 0.5px solid #2a2a2a;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .card:active {
            transform: scale(0.98);
        }

        .vs-title {
            font-size: 20px;
            font-weight: 800;
            margin: 8px 0;
        }

        .opinions {
            display: flex;
            gap: 12px;
            margin: 14px 0;
        }

        .opinion {
            flex: 1;
            background: #1a1a1a;
            padding: 14px;
            border-radius: 24px;
        }

        .role.a { color: #ff6b6b; font-weight: 800; }
        .role.b { color: #4d9fff; font-weight: 800; }

        .ai-verdict {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 24px;
            padding: 16px;
            margin: 16px 0;
            border: 1px solid #7c3aed40;
        }

        .ai-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .ai-icon {
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .verdict-text {
            font-size: 14px;
            line-height: 1.5;
            color: #cbd5e1;
            white-space: pre-wrap;
        }

        .ai-suggestion {
            background: #0f0f1a;
            border-radius: 16px;
            padding: 12px;
            margin-top: 12px;
            font-size: 13px;
            border-left: 3px solid #a855f7;
        }

        .ai-btn {
            background: #7c3aed20;
            border: 1px solid #7c3aed;
            color: #a855f7;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 12px;
            cursor: pointer;
            margin-top: 12px;
        }

        .vote-area {
            display: flex;
            gap: 12px;
            margin: 14px 0;
        }

        .vote-btn {
            flex: 1;
            background: #252525;
            border: none;
            padding: 12px;
            border-radius: 44px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .vote-btn:active {
            transform: scale(0.97);
        }

        .vote-btn.a-vote { background: #3e2020; border: 0.5px solid #ff6b6b; }
        .vote-btn.b-vote { background: #1f2c3a; border: 0.5px solid #4d9fff; }

        .vote-stats {
            background: #0d0d0d;
            border-radius: 20px;
            padding: 14px;
            margin-top: 12px;
            text-align: center;
        }

        .vote-stats-hidden {
            background: #0d0d0d;
            border-radius: 20px;
            padding: 14px;
            margin-top: 12px;
            text-align: center;
            color: #71767b;
            border: 0.5px dashed #3a3a3a;
        }

        .vote-bar {
            display: flex;
            height: 8px;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }

        .vote-bar-a {
            background: #ff6b6b;
            transition: width 0.3s;
        }

        .vote-bar-b {
            background: #4d9fff;
            transition: width 0.3s;
        }

        .vote-numbers {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 13px;
            font-weight: 600;
        }

        .vote-numbers .a { color: #ff6b6b; }
        .vote-numbers .b { color: #4d9fff; }

        .stats {
            display: flex;
            gap: 18px;
            font-size: 12px;
            color: #71767b;
            margin-top: 12px;
        }

        .enter-detail {
            margin-top: 14px;
            text-align: center;
            color: #ff7a45;
            font-weight: 600;
            font-size: 13px;
        }

        .detail-page, .form-page {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000;
            z-index: 200;
            overflow-y: auto;
            display: none;
        }

        .detail-page.active, .form-page.active { display: block; }

        .sub-header {
            position: sticky;
            top: 0;
            background: rgba(0,0,0,0.94);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-back-btn {
            background: #1a1a1a;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            color: #ff7a45;
            border: none;
        }

        .form-input, .form-textarea {
            width: 100%;
            background: #1c1c1c;
            border: 0.5px solid #3a3a3a;
            border-radius: 20px;
            padding: 14px;
            color: white;
            margin-bottom: 12px;
            font-family: inherit;
        }

        .form-side {
            background: #181818;
            border-radius: 24px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .form-footer {
            position: fixed;
            bottom: 0;
            padding: 14px 20px;
            background: linear-gradient(to top, #000 85%, transparent);
            max-width: 600px;
            width: 100%;
        }

        .submit-btn {
            background: linear-gradient(135deg, #ff4d4d, #ff9f4d);
            width: 100%;
            padding: 16px;
            border-radius: 32px;
            color: white;
            font-weight: 800;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s;
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .comment-section {
            margin-top: 20px;
            background: #0c0c0c;
            border-radius: 24px;
            padding: 16px;
        }

        .comment-section textarea {
            width: 100%;
            background: #1c1c1c;
            border-radius: 20px;
            padding: 12px;
            color: white;
            margin-top: 12px;
            border: 0.5px solid #3a3a3a;
        }

        .small-btn {
            background: #ff7a45;
            border: none;
            padding: 8px 18px;
            border-radius: 40px;
            color: black;
            font-weight: 700;
            margin-top: 10px;
            cursor: pointer;
        }

        .like-btn {
            background: none;
            border: none;
            color: #ff6b6b;
            cursor: pointer;
            font-size: 12px;
            margin-left: 8px;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
        }

        .loading-overlay .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid #7c3aed;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-overlay p {
            color: #a855f7;
            font-size: 14px;
        }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <h1>🥊 吵架擂台</h1>
        <div class="ai-badge">🤖 DeepSeek AI 裁判</div>
    </div>

    <div class="create-btn-wrap">
        <button class="create-btn" id="openCreateModalBtn">⚡ 发起擂台 · AI裁判</button>
    </div>

    <div class="categories" id="categoryList"></div>
    <div class="tabs">
        <div class="tab active" data-sort="hot">🔥 热门</div>
        <div class="tab" data-sort="new">✨ 最新</div>
    </div>
    <div id="caseListContainer"></div>
</div>

<div id="caseDetailPage" class="detail-page">
    <div class="app">
        <div class="sub-header">
            <button class="form-back-btn" id="closeDetailBtn">←</button>
            <h2>AI 裁判分析中...</h2>
        </div>
        <div id="caseDetailContainer"></div>
    </div>
</div>

<div id="createFormPage" class="form-page">
    <div class="app">
        <div class="sub-header">
            <button class="form-back-btn" id="closeFormBtn">←</button>
            <h2>🥊 发起擂台</h2>
        </div>
        <div class="form-container" style="padding: 16px;">
            <input class="form-input" id="caseTitle" placeholder="擂台标题，例：另一半偷偷看我的手机，该原谅吗？">
            <div class="form-side">
                <div class="role a">🔴 我方立场</div>
                <input class="form-input" id="myRole" placeholder="称呼" value="老婆">
                <textarea class="form-textarea" id="myView" rows="4" placeholder="描述你的观点..."></textarea>
            </div>
            <div class="form-side">
                <div class="role b">🔵 对方立场</div>
                <input class="form-input" id="opponentRole" placeholder="称呼" value="老公">
                <textarea class="form-textarea" id="opponentView" rows="4" placeholder="描述对方的观点..."></textarea>
            </div>
        </div>
        <div class="form-footer">
            <button class="submit-btn" id="submitCaseBtn">🔥 提交 · AI将深度分析</button>
        </div>
    </div>
</div>

<script>
    // ============================================================
    // 🔑 在这里输入你的 DeepSeek API Key
    // 获取地址：https://platform.deepseek.com/api_keys
    // ============================================================
    const DEEPSEEK_API_KEY = "sk-6537f2c663b2444884ce44a38e751ab0";  // 👈 替换成你的真实API Key！
    // ============================================================

    let cases = [];
    let currentCategory = "全部";
    let currentSort = "hot";
    let currentDetailCaseId = null;

    const categoriesList = ["全部", "感情观", "金钱观", "家事分工", "婆媳问题", "生活习惯", "社交界线", "其他"];

    // 从 localStorage 加载数据
    function loadData() {
        const saved = localStorage.getItem('cases');
        if (saved && saved !== '[]') {
            cases = JSON.parse(saved);
        } else {
            // 示例案例
            cases = [
                {
                    id: "sample1",
                    title: "另一半偷偷看我的手机，该原谅吗？",
                    category: "感情观",
                    hideGender: false,
                    sideA: { role: "老婆", text: "我发现你趁我洗澡的时候翻我手机，看了我的微信聊天记录和相册。这不是第一次了，上次你说不会再犯，结果今天又被我抓到。两个人在一起最重要的就是信任，你这样做让我觉得自己像个犯人，随时被监视。我又没有做对不起你的事，你为什么要这样？如果你有什么不安，可以直接问我，而不是用这种方式。这次我真的很难过，感觉我们的信任基础被你亲手破坏了。" },
                    sideB: { role: "老公", text: "我知道翻你手机不对，但我真的是因为太在乎你了。上次看到你和一个男同事聊天很频繁，我就一直心里不舒服，但又不敢问，怕你觉得我小心眼。我只是想确认一下，没有别的意思。我知道我错了，但这不也是因为爱你才这样吗？而且我也没有做什么过分的事，就翻了翻，又没删除什么。你就不能理解一下我的心情吗？我保证这是最后一次，真的。" },
                    votes: { A: 0, B: 0 },
                    comments: [],
                    createdAt: Date.now(),
                    aiVerdict: null
                }
            ];
            saveData();
        }
    }

    function saveData() {
        localStorage.setItem('cases', JSON.stringify(cases));
    }

    function showLoading(message = "AI裁判思考中，请稍候...") {
        let overlay = document.getElementById('loadingOverlay');
        if (!overlay) {
            overlay = document.createElement('div');
            overlay.id = 'loadingOverlay';
            overlay.className = 'loading-overlay';
            overlay.innerHTML = `
                <div class="spinner"></div>
                <p id="loadingMessage">${message}</p>
            `;
            document.body.appendChild(overlay);
        } else {
            const msgEl = document.getElementById('loadingMessage');
            if (msgEl) msgEl.innerText = message;
            overlay.style.display = 'flex';
        }
    }

    function hideLoading() {
        const overlay = document.getElementById('loadingOverlay');
        if (overlay) overlay.style.display = 'none';
    }

    function hasUserVoted(caseId) {
        const votedCases = JSON.parse(localStorage.getItem('voted_cases') || '{}');
        return votedCases[caseId] === true;
    }

    function markUserVoted(caseId) {
        const votedCases = JSON.parse(localStorage.getItem('voted_cases') || '{}');
        votedCases[caseId] = true;
        localStorage.setItem('voted_cases', JSON.stringify(votedCases));
    }

    window.voteForCase = (id, side) => {
        const c = cases.find(c => c.id === id);
        if (c) {
            c.votes[side]++;
            saveData();
            markUserVoted(id);
            refreshDetail(id);
        }
    };

    async function callDeepSeekAI(sideAText, sideBText, roleA, roleB, title) {
        if (!DEEPSEEK_API_KEY || DEEPSEEK_API_KEY === "YOUR_API_KEY_HERE") {
            return {
                verdict: "⚠️ 请先在代码中配置 DeepSeek API Key！\n\n将代码开头的 DEEPSEEK_API_KEY 替换成你的真实密钥。\n获取地址：platform.deepseek.com/api_keys",
                suggestion: "新用户有免费额度，快去注册吧！",
                error: true
            };
        }

        const prompt = `你是一位公正、理性、有同理心的吵架调解AI。请分析以下情侣/夫妻争吵案例，给出判决。

【案例题目】${title}
【${roleA}的观点】${sideAText}
【${roleB}的观点】${sideBText}

请按以下格式输出（用JSON格式）：
{
    "verdict": "判决结果（200字以内，指出谁更有道理，为什么）",
    "suggestion": "和解建议（150字以内，给出具体可执行的建议）",
    "winner": "支持哪一方"
}

注意：要客观中立，不偏袒任何一方，基于论据逻辑和情感需求分析。`;

        try {
            const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${DEEPSEEK_API_KEY}`
                },
                body: JSON.stringify({
                    model: 'deepseek-chat',
                    messages: [
                        { role: 'system', content: '你是一个公正的婚姻家庭调解专家，善于理性分析和给出建设性建议。' },
                        { role: 'user', content: prompt }
                    ],
                    temperature: 0.7,
                    max_tokens: 800
                })
            });

            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.error?.message || 'API请求失败');
            }

            const data = await response.json();
            const content = data.choices[0].message.content;
            
            const jsonMatch = content.match(/\{[\s\S]*\}/);
            if (jsonMatch) {
                return JSON.parse(jsonMatch[0]);
            }
            
            return {
                verdict: content,
                suggestion: "建议双方多沟通，互相理解。",
                winner: "待定"
            };
        } catch (error) {
            console.error('AI调用失败:', error);
            return {
                verdict: `❌ AI分析失败: ${error.message}`,
                suggestion: "请检查API Key是否正确，或稍后重试。",
                error: true
            };
        }
    }

    async function generateAIVerdictForCase(caseItem) {
        const roleA = caseItem.hideGender ? "A方" : caseItem.sideA.role;
        const roleB = caseItem.hideGender ? "B方" : caseItem.sideB.role;
        
        const result = await callDeepSeekAI(
            caseItem.sideA.text, 
            caseItem.sideB.text, 
            roleA, 
            roleB, 
            caseItem.title
        );
        
        caseItem.aiVerdict = result;
        saveData();
        return result;
    }

    function getCaseStats(c) {
        const total = c.votes.A + c.votes.B;
        const aPercent = total === 0 ? 50 : (c.votes.A / total * 100).toFixed(0);
        const bPercent = total === 0 ? 50 : (c.votes.B / total * 100).toFixed(0);
        const displayA = c.hideGender ? "A方" : c.sideA.role;
        const displayB = c.hideGender ? "B方" : c.sideB.role;
        return { total, aPercent, bPercent, displayA, displayB };
    }

    function renderVoteArea(c, stats, hasVoted) {
        if (hasVoted) {
            const totalVotes = stats.total;
            const aWidth = totalVotes === 0 ? 50 : (c.votes.A / totalVotes * 100);
            const bWidth = totalVotes === 0 ? 50 : (c.votes.B / totalVotes * 100);
            return `
                <div class="vote-stats">
                    <div class="vote-bar">
                        <div class="vote-bar-a" style="width: ${aWidth}%;"></div>
                        <div class="vote-bar-b" style="width: ${bWidth}%;"></div>
                    </div>
                    <div class="vote-numbers">
                        <span class="a">🔥 ${escapeHtml(stats.displayA)}: ${c.votes.A}票 (${stats.aPercent}%)</span>
                        <span class="b">💧 ${escapeHtml(stats.displayB)}: ${c.votes.B}票 (${stats.bPercent}%)</span>
                    </div>
                    <div style="font-size: 11px; color: #ff7a45; margin-top: 8px;">
                        ✅ 您已投票 · 感谢参与
                    </div>
                </div>
            `;
        } else {
            return `
                <div class="vote-stats-hidden">
                    <span style="opacity: 0.6;">🔒 投票后可查看当前票数</span>
                    <div style="font-size: 12px; color: #ff7a45; margin-top: 6px;">
                        快来支持你认为有理的一方！
                    </div>
                </div>
            `;
        }
    }

    window.likeComment = (id, idx) => {
        const c = cases.find(c => c.id === id);
        if (c && c.comments[idx]) { 
            c.comments[idx].likes++; 
            saveData(); 
            refreshDetail(id); 
        }
    };

    window.addComment = (id) => {
        const ta = document.getElementById(`comment-${id}`);
        if (!ta.value.trim()) return;
        const c = cases.find(c => c.id === id);
        if (c) { 
            c.comments.push({ text: ta.value.trim(), likes: 0 }); 
            ta.value = ''; 
            saveData(); 
            refreshDetail(id); 
        }
    };

    window.refreshAIDetail = async (id) => {
        const c = cases.find(c => c.id === id);
        if (c) {
            showLoading("AI裁判重新分析中...");
            await generateAIVerdictForCase(c);
            hideLoading();
            renderCaseDetail(id);
        }
    };

    async function refreshDetail(id) {
        if (currentDetailCaseId === id) {
            await renderCaseDetail(id);
        }
        renderCases();
    }

    async function renderCaseDetail(id) {
        const c = cases.find(c => c.id === id);
        if (!c) return;
        
        const stats = getCaseStats(c);
        const hasVoted = hasUserVoted(id);
        
        if (!c.aiVerdict) {
            showLoading("AI裁判分析中...");
            await generateAIVerdictForCase(c);
            hideLoading();
        }
        
        const ai = c.aiVerdict || { verdict: "分析中...", suggestion: "请稍后" };
        
        const container = document.getElementById("caseDetailContainer");
        container.innerHTML = `
            <div class="card" style="cursor: default;">
                <div class="vs-title">${escapeHtml(c.title)}</div>
                <div class="opinions">
                    <div class="opinion"><div class="role a">🔴 ${escapeHtml(stats.displayA)}</div><div class="text">${escapeHtml(c.sideA.text)}</div></div>
                    <div class="opinion"><div class="role b">🔵 ${escapeHtml(stats.displayB)}</div><div class="text">${escapeHtml(c.sideB.text)}</div></div>
                </div>
                <div class="vote-area">
                    <button class="vote-btn a-vote" onclick="voteForCase('${c.id}','A')">🔥 支持 ${escapeHtml(stats.displayA)}</button>
                    <button class="vote-btn b-vote" onclick="voteForCase('${c.id}','B')">💧 支持 ${escapeHtml(stats.displayB)}</button>
                </div>
                ${renderVoteArea(c, stats, hasVoted)}
                <div class="ai-verdict">
                    <div class="ai-header"><div class="ai-icon">🤖</div><h4>DeepSeek AI 裁判</h4></div>
                    <div class="verdict-text">📜 ${escapeHtml(ai.verdict || '分析中...')}</div>
                    ${ai.suggestion ? `<div class="ai-suggestion">💡 和解建议：${escapeHtml(ai.suggestion)}</div>` : ''}
                    <button class="ai-btn" onclick="refreshAIDetail('${c.id}')">🔄 重新让AI分析</button>
                </div>
                <div class="comment-section">
                    <div>🗣️ 观众劝架区</div>
                    ${(c.comments || []).map((cm, idx) => `<div style="padding:8px 0; border-bottom:0.5px solid #2c2c2c;">💬 ${escapeHtml(cm.text)} <button class="like-btn" onclick="likeComment('${c.id}',${idx})">❤️ ${cm.likes}</button></div>`).join('')}
                    <textarea id="comment-${c.id}" placeholder="写下你的公正建议..."></textarea>
                    <button class="small-btn" onclick="addComment('${c.id}')">✍️ 送出劝架</button>
                </div>
            </div>
        `;
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function renderCases() {
        let filtered = cases.filter(c => currentCategory === "全部" || c.category === currentCategory);
        if (currentSort === "hot") {
            filtered.sort((a,b) => (b.votes.A + b.votes.B) - (a.votes.A + a.votes.B));
        } else {
            filtered.sort((a,b) => b.createdAt - a.createdAt);
        }
        
        const container = document.getElementById("caseListContainer");
        if (!filtered.length) {
            container.innerHTML = `<div style="text-align:center; padding:40px;">⚡ 暂无擂台，发起一个吧</div>`;
            return;
        }
        
        container.innerHTML = filtered.map(c => {
            const stats = getCaseStats(c);
            const hasVoted = hasUserVoted(c.id);
            const voteDisplay = hasVoted ? `📊 ${stats.aPercent}% : ${stats.bPercent}%` : `🔒 投票后可见结果`;
            return `
                <div class="card" data-id="${c.id}">
                    <div class="vs-title">${escapeHtml(c.title)}</div>
                    <div class="opinions">
                        <div class="opinion"><div class="role a">🔴 ${escapeHtml(stats.displayA)}</div><div class="text">${escapeHtml(c.sideA.text.substring(0,60))}...</div></div>
                        <div class="opinion"><div class="role b">🔵 ${escapeHtml(stats.displayB)}</div><div class="text">${escapeHtml(c.sideB.text.substring(0,60))}...</div></div>
                    </div>
                    <div class="stats">${voteDisplay} &nbsp; 💬 ${c.comments?.length || 0}</div>
                    <div class="enter-detail">⚡ 查看DeepSeek AI裁判判决 →</div>
                </div>
            `;
        }).join('');
        
        // 绑定点击事件
        document.querySelectorAll('.card[data-id]').forEach(el => {
            el.addEventListener('click', (e) => {
                // 防止点击按钮时触发
                if (e.target.tagName === 'BUTTON') return;
                openDetail(el.dataset.id);
            });
        });
    }

    async function openDetail(id) {
        currentDetailCaseId = id;
        document.getElementById("caseDetailPage").classList.add("active");
        await renderCaseDetail(id);
    }

    function closeDetail() {
        document.getElementById("caseDetailPage").classList.remove("active");
        currentDetailCaseId = null;
    }

    function renderCategories() {
        const container = document.getElementById("categoryList");
        container.innerHTML = categoriesList.map(cat => `<div class="cat-item ${currentCategory === cat ? 'active' : ''}" data-cat="${cat}">${cat}</div>`).join('');
        document.querySelectorAll('.cat-item').forEach(el => {
            el.addEventListener('click', () => {
                currentCategory = el.dataset.cat;
                renderCategories();
                renderCases();
            });
        });
    }

    function bindTabs() {
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                currentSort = tab.dataset.sort;
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                renderCases();
            });
        });
    }

    function showForm() { 
        document.getElementById("createFormPage").classList.add("active"); 
    }
    
    function hideForm() { 
        document.getElementById("createFormPage").classList.remove("active"); 
    }

    async function submitCase(event) {
        if (event) event.preventDefault();
        
        const title = document.getElementById("caseTitle").value.trim();
        const myRole = document.getElementById("myRole").value.trim() || "我方";
        const myView = document.getElementById("myView").value.trim();
        const oppRole = document.getElementById("opponentRole").value.trim() || "对方";
        const oppView = document.getElementById("opponentView").value.trim();
        
        if (!title || !myView || !oppView) {
            alert("请完整填写双方观点");
            return;
        }
        
        const submitBtn = document.getElementById("submitCaseBtn");
        submitBtn.disabled = true;
        submitBtn.textContent = "⏳ AI分析中，请稍候...";
        
        const newCase = {
            id: Date.now().toString(),
            title: title,
            category: "其他",
            hideGender: false,
            sideA: { role: myRole, text: myView },
            sideB: { role: oppRole, text: oppView },
            votes: { A: 0, B: 0 },
            comments: [],
            createdAt: Date.now(),
            aiVerdict: null
        };
        
        cases.unshift(newCase);
        saveData();
        
        hideForm();
        showLoading("AI裁判正在分析您的案件...");
        
        if (DEEPSEEK_API_KEY && DEEPSEEK_API_KEY !== "YOUR_API_KEY_HERE") {
            await generateAIVerdictForCase(newCase);
        }
        
        hideLoading();
        renderCases();
        await openDetail(newCase.id);
        
        // 清空表单
        document.getElementById("caseTitle").value = "";
        document.getElementById("myView").value = "";
        document.getElementById("opponentView").value = "";
        
        submitBtn.disabled = false;
        submitBtn.textContent = "🔥 提交 · AI将深度分析";
    }

    // 初始化
    loadData();
    renderCategories();
    renderCases();
    bindTabs();
    
    document.getElementById("openCreateModalBtn").addEventListener("click", showForm);
    document.getElementById("closeFormBtn").addEventListener("click", hideForm);
    document.getElementById("closeDetailBtn").addEventListener("click", closeDetail);
    
    const submitBtn = document.getElementById("submitCaseBtn");
    submitBtn.addEventListener("click", submitCase);
</script>
</body>
</html>
