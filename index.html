        const existing = document.querySelector('.toast-message');
        if (existing) existing.remove();
        const toast = document.createElement('div');
        toast.className = 'toast-message';
        toast.textContent = message;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
    }
    
    function showLoading(text) {
        const overlay = document.getElementById('loadingOverlay');
        const loadingText = document.getElementById('loadingText');
        loadingText.textContent = text || '加载中...';
        overlay.classList.add('active');
    }
    
    function hideLoading() {
        document.getElementById('loadingOverlay').classList.remove('active');
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
    }
    
    function updateStatusBar(message, isError = false) {
        const bar = document.getElementById('statusBar');
        bar.textContent = message;
        if (isError) {
            bar.classList.add('error');
        } else {
            bar.classList.remove('error');
        }
    }
    
    // ==================== 匿名登录 ====================

        try {
            updateStatusBar("⏳ 正在连接服务器...");
            const result = await signInAnonymously(auth);
            currentUser = result.user;
            updateStatusBar("✅ 已连接云端，数据自动保存");
            console.log("匿名登录成功，用户ID:", currentUser.uid);
            return currentUser;
        } catch (error) {
            console.error("匿名登录失败:", error);
            updateStatusBar("⚠️ 连接失败，请检查Firebase设置", true);
            // 降级：创建临时用户
            currentUser = { uid: 'local_' + Date.now(), isAnonymous: true };
            return currentUser;
        }
    }
    
    // ==================== 加载用户投票记录 ====================
    async function loadUserVotes() {
        if (!currentUser || currentUser.isAnonymous === false) return;
        try {
            const votesRef = collection(db, "votes");
            const q = query(votesRef, where("userId", "==", currentUser.uid));
            const snapshot = await getDocs(q);
            userVotesMap.clear();
            snapshot.forEach(doc => {
                const data = doc.data();
                userVotesMap.set(data.caseId, data.side);
            });
        } catch (e) {
            console.error("加载投票记录失败:", e);
        }
    }
    
    // ==================== 实时订阅擂台数据 ====================
    function subscribeToCases() {
        if (unsubscribeCases) unsubscribeCases();
        
        const casesRef = collection(db, "cases");
        const q = query(casesRef, orderBy("createdAt", "desc"));
        
        unsubscribeCases = onSnapshot(q, async (snapshot) => {
            casesData = [];
            for (const doc of snapshot.docs) {
                const caseData = { id: doc.id, ...doc.data() };
                // 加载评论
                try {
                    const commentsRef = collection(db, "comments");
                    const commentsQuery = query(commentsRef, where("caseId", "==", doc.id), orderBy("createdAt", "desc"));
                    const commentsSnapshot = await getDocs(commentsQuery);
                    caseData.comments = commentsSnapshot.docs.map(c => ({ id: c.id, ...c.data() }));
                } catch(e) {
                    caseData.comments = [];
                }
                casesData.push(caseData);
            }
            
            // 如果没有数据，创建示例数据
            if (casesData.length === 0) {
                await createSampleCases();
            } else {
                renderCases();
                renderDailyFeatured();
                if (currentDetailCaseId) {
                    renderCaseDetail(currentDetailCaseId);
                }

            console.error("加载数据失败:", error);
            updateStatusBar("⚠️ 数据同步失败，请刷新页面", true);

                title: "过年该回谁家？双方都是独生子女",
                category: "家事分工",
                sideA: { role: "老婆", text: "我家就我一个女儿，爸妈年纪大了，过年不回去他们多孤单？你家还有兄弟姐妹可以陪父母啊。而且去年就去你家了，今年该轮到我家了。" },
                sideB: { role: "老公", text: "传统上不都是回男方家过年吗？而且我家虽然有人，但父母还是希望我们回去。可以轮流或者各回各家？" },
                votes: { A: 15, B: 10 }
            }
        ];
        
        for (const sample of sampleCases) {
            try {
                // 生成 AI 判决
                const aiResult = await callDeepSeekAI(
                    sample.sideA.text, sample.sideB.text,
                    sample.sideA.role, sample.sideB.role,
                    sample.title
                );
                
                const caseData = {
                    title: sample.title,
                    category: sample.category,
                    createdAt: Date.now() - Math.random() * 86400000 * 3,
                    sideA: sample.sideA,
                    sideB: sample.sideB,
                    votes: sample.votes,
                    commentsCount: 0,
                    createdBy: currentUser?.uid || "system",
                    aiVerdict: aiResult
                };
                
                await addDoc(collection(db, "cases"), caseData);
            } catch(e) {
                console.error("创建示例失败:", e);
            }
        }
        
        hideLoading();
        showToast("✅ 示例擂台已创建！");
    }
    
    // ==================== AI 分析 ====================
    async function callDeepSeekAI(sideAText, sideBText, roleA, roleB, title) {
        const prompt = `你是一位公正的吵架调解AI。请分析以下案例：

【题目】${title}
【${roleA}的观点】${sideAText}
【${roleB}的观点】${sideBText}

请用JSON格式输出：
{"verdict": "判决结果（150字以内）", "suggestion": "和解建议（100字以内）"}`;

        try {
            const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${DEEPSEEK_API_KEY}`
                },
                body: JSON.stringify({
                    model: 'deepseek-chat',
                    messages: [{ role: 'user', content: prompt }],
                    temperature: 0.7,
                    max_tokens: 600
                })
            });
            
            if (!response.ok) throw new Error(`API错误: ${response.status}`);
            const data = await response.json();
            const content = data.choices[0].message.content;
            const jsonMatch = content.match(/\{[\s\S]*\}/);
            if (jsonMatch) return JSON.parse(jsonMatch[0]);
            return { verdict: content.substring(0, 200), suggestion: "建议双方多沟通" };
        } catch (error) {
            console.error("AI错误:", error);
            return { 
                verdict: "双方都有道理，建议冷静沟通。", 
                suggestion: "1. 换位思考 2. 表达感受而非指责 3. 寻找共同目标" 
            };
        }
    }
    
    // ==================== 创建新擂台 ====================
    async function createCase(title, sideARole, sideAText, sideBRole, sideBText) {
        showLoading("AI裁判分析中...");
        
        try {
            // 确保有用户
            if (!currentUser) {
                await anonymousLogin();
            }
            
            // 获取 AI 判决
            const aiResult = await callDeepSeekAI(sideAText, sideBText, sideARole, sideBRole, title);
            
            const caseData = {
                title: title,
                category: "其他",
                createdAt: Date.now(),
                sideA: { role: sideARole, text: sideAText },
                sideB: { role: sideBRole, text: sideBText },
                votes: { A: 0, B: 0 },
                commentsCount: 0,
                createdBy: currentUser?.uid || "anonymous",
                aiVerdict: aiResult
            };
            
            const docRef = await addDoc(collection(db, "cases"), caseData);
            hideLoading();
            showToast("✅ 擂台创建成功！");
            return { id: docRef.id, ...caseData };
        } catch (error) {
            hideLoading();
            console.error("创建失败:", error);
            showToast("创建失败: " + error.message);
            return null;
        }
    }
    
    // ==================== 投票 ====================
    window.voteForCase = async (caseId, side) => {
        if (!currentUser) {
            showToast("请稍后，正在连接服务器...");
            return;
        }
        
        const voteId = `${caseId}_${currentUser.uid}`;
        const voteRef = doc(db, "votes", voteId);
        
        try {
            const voteSnap = await getDoc(voteRef);
            if (voteSnap.exists()) {
                showToast("你已经投过票了");
                return;
            }
            
            showLoading("投票中...");
            
            await setDoc(voteRef, {
                caseId: caseId,
                userId: currentUser.uid,
                side: side,
                votedAt: Date.now()
            });
            
            const caseRef = doc(db, "cases", caseId);
            const updateField = side === 'A' ? 'votes.A' : 'votes.B';
            await updateDoc(caseRef, { [updateField]: increment(1) });
            
            userVotesMap.set(caseId, side);
            hideLoading();
            showToast(`✅ 投票成功！`);
        } catch (error) {
            hideLoading();
            showToast("投票失败: " + error.message);
        }
    };
    
    // ==================== 评论 ====================
    window.addComment = async (caseId) => {
        const textarea = document.getElementById(`comment-${caseId}`);
        const text = textarea?.value.trim();
        if (!text) return;
        
        try {
            await addDoc(collection(db, "comments"), {
                caseId: caseId,
                userId: currentUser?.uid || "anonymous",
                userName: "游客",
                text: text,
                likes: 0,
                createdAt: Date.now()
            });
            
            const caseRef = doc(db, "cases", caseId);
            await updateDoc(caseRef, { commentsCount: increment(1) });
            
            textarea.value = '';
            showToast("评论已发送");
        } catch (error) {
            showToast("评论失败: " + error.message);
        }
    };
    
    window.likeComment = async (commentId, currentLikes) => {
        try {
            const commentRef = doc(db, "comments", commentId);
            await updateDoc(commentRef, { likes: currentLikes + 1 });
        } catch(e) {}
    };
    
    // ==================== 渲染函数 ====================
    function getCaseStats(c) {
        const total = (c.votes?.A || 0) + (c.votes?.B || 0);
        const aPercent = total === 0 ? 50 : ((c.votes?.A || 0) / total * 100).toFixed(0);
        const bPercent = total === 0 ? 50 : ((c.votes?.B || 0) / total * 100).toFixed(0);
        return { total, aPercent, bPercent, displayA: c.sideA.role, displayB: c.sideB.role };
    }
    
    function hasUserVoted(caseId) {
        return userVotesMap.has(caseId);
    }
    
    function getUserVotedSide(caseId) {
        return userVotesMap.get(caseId);
    }
    
    async function renderCaseDetail(caseId) {
        const c = casesData.find(c => c.id === caseId);
        if (!c) return;
        
        const stats = getCaseStats(c);
        const hasVoted = hasUserVoted(caseId);
        const userVotedSide = getUserVotedSide(caseId);
        const ai = c.aiVerdict || { verdict: "分析中...", suggestion: "" };
        const totalVotes = (c.votes?.A || 0) + (c.votes?.B || 0);
        const aWidth = totalVotes === 0 ? 50 : (c.votes?.A || 0) / totalVotes * 100;
        const bWidth = totalVotes === 0 ? 50 : (c.votes?.B || 0) / totalVotes * 100;
        
        const container = document.getElementById("caseDetailContainer");
        container.innerHTML = `
            <div class="card" style="cursor:default;">
                <div class="vs-title">${escapeHtml(c.title)}</div>
                <div class="opinions">
                    <div class="opinion"><div class="role a">🔴 ${escapeHtml(stats.displayA)}</div><div class="text">${escapeHtml(c.sideA.text)}</div></div>
                    <div class="opinion"><div class="role b">🔵 ${escapeHtml(stats.displayB)}</div><div class="text">${escapeHtml(c.sideB.text)}</div></div>
                </div>
                <div class="vote-area">
                    <button class="vote-btn a-vote ${hasVoted ? 'disabled' : ''}" onclick="voteForCase('${c.id}','A')" ${hasVoted ? 'disabled' : ''}>🔥 支持 ${escapeHtml(stats.displayA)}</button>
                    <button class="vote-btn b-vote ${hasVoted ? 'disabled' : ''}" onclick="voteForCase('${c.id}','B')" ${hasVoted ? 'disabled' : ''}>💧 支持 ${escapeHtml(stats.displayB)}</button>
                </div>
                <div class="vote-stats">
                    <div class="vote-bar"><div class="vote-bar-a" style="width: ${aWidth}%;"></div><div class="vote-bar-b" style="width: ${bWidth}%;"></div></div>
                    <div class="vote-numbers"><span class="a">🔥 ${stats.displayA}: ${c.votes?.A || 0}票 (${stats.aPercent}%)</span><span class="b">💧 ${stats.displayB}: ${c.votes?.B || 0}票 (${stats.bPercent}%)</span></div>
                </div>
                <div class="share-buttons">
                    <button class="share-btn" onclick="copyShareLink('${c.id}')">🔗 复制链接分享</button>
                </div>
                <div class="ai-verdict">
                    <div class="ai-header"><div class="ai-icon">🤖</div><h4>DeepSeek AI 裁判</h4></div>
                    <div class="verdict-text">📜 ${escapeHtml(ai.verdict)}</div>
                    ${ai.suggestion ? `<div class="ai-suggestion">💡 和解建议：${escapeHtml(ai.suggestion)}</div>` : ''}
                </div>
                <div class="comment-section">
                    <div>🗣️ 观众劝架区 (${c.comments?.length || 0})</div>
                    ${(c.comments || []).map(cm => `<div style="padding:8px 0; border-bottom:0.5px solid #2c2c2c;">💬 ${escapeHtml(cm.text)}<br><span style="font-size:11px; color:#71767b;">— ${escapeHtml(cm.userName || '游客')}</span> <button class="like-btn" onclick="likeComment('${cm.id}', ${cm.likes})">❤️ ${cm.likes}</button></div>`).join('')}
                    <textarea id="comment-${c.id}" placeholder="写下你的公正建议..."></textarea>
                    <button class="small-btn" onclick="addComment('${c.id}')">✍️ 送出劝架</button>
                </div>
            </div>
        `;
    }
    
    function renderCases() {
        let filtered = casesData.filter(c => {
            if (currentCategory !== "全部" && c.category !== currentCategory) return false;
            return true;
        });
        
        if (currentSort === "hot") {
            filtered.sort((a, b) => ((b.votes?.A || 0) + (b.votes?.B || 0)) - ((a.votes?.A || 0) + (a.votes?.B || 0)));
        } else {
            filtered.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
        }
        
        const container = document.getElementById("caseListContainer");
        if (!filtered.length) {
            container.innerHTML = `<div class="no-results">⚡ 暂无擂台，点击上方按钮发起第一个擂台！</div>`;
            return;
        }
        
        container.innerHTML = filtered.map(c => {
            const stats = getCaseStats(c);
            return `<div class="card" data-id="${c.id}">
                <div class="vs-title">${escapeHtml(c.title)}</div>
                <div class="opinions">
                    <div class="opinion"><div class="role a">🔴 ${escapeHtml(stats.displayA)}</div><div class="text">${escapeHtml(c.sideA.text.substring(0, 55))}...</div></div>
                    <div class="opinion"><div class="role b">🔵 ${escapeHtml(stats.displayB)}</div><div class="text">${escapeHtml(c.sideB.text.substring(0, 55))}...</div></div>
                </div>
                <div class="stats">📊 ${(c.votes?.A || 0) + (c.votes?.B || 0)}人投票 &nbsp; 💬 ${c.comments?.length || 0}</div>
                <div class="enter-detail">⚡ 查看AI裁判判决 →</div>
            </div>`;
        }).join('');
        
        document.querySelectorAll('.card[data-id]').forEach(el => {
            el.addEventListener('click', () => openDetail(el.dataset.id));
        });
    }
    
    function renderDailyFeatured() {
        if (casesData.length === 0) return;
        const featured = [...casesData].sort((a, b) => 
            ((b.votes?.A || 0) + (b.votes?.B || 0) + (b.comments?.length || 0) * 5) - 
            ((a.votes?.A || 0) + (a.votes?.B || 0) + (a.comments?.length || 0) * 5)
        )[0];
        
        const container = document.getElementById("dailyFeaturedContainer");
        if (!featured) return;
        
        const stats = getCaseStats(featured);
        container.innerHTML = `
            <div class="daily-featured">
                <div class="daily-featured-header">
                    <span class="icon">🌟</span>
                    <span class="title">每日精选擂台</span>
                </div>
                <div class="card featured-card" style="margin:0; cursor:pointer;" data-id="${featured.id}">
                    <div class="vs-title">${escapeHtml(featured.title)}<span class="featured-badge">🔥 热门推荐</span></div>
                    <div class="opinions">
                        <div class="opinion"><div class="role a">🔴 ${escapeHtml(stats.displayA)}</div><div class="text">${escapeHtml(featured.sideA.text.substring(0, 50))}...</div></div>
                        <div class="opinion"><div class="role b">🔵 ${escapeHtml(stats.displayB)}</div><div class="text">${escapeHtml(featured.sideB.text.substring(0, 50))}...</div></div>
                    </div>
                    <div class="stats">📊 ${(featured.votes?.A || 0) + (featured.votes?.B || 0)}人投票 &nbsp; 💬 ${featured.comments?.length || 0}</div>
                    <div class="enter-detail">⚡ 查看AI裁判判决 →</div>
                </div>
            </div>
        `;
        const card = container.querySelector('.card');
        if (card) card.addEventListener('click', () => openDetail(featured.id));
    }
    
    // ==================== 搜索功能 ====================
    function performSearch(keyword) {
        if (!keyword.trim()) {
            showToast("请输入搜索关键词");
            return;
        }
        
        currentSearchKeyword = keyword;
        const results = casesData.filter(c => c.title.toLowerCase().includes(keyword.toLowerCase()));
        
        const container = document.getElementById('searchResultContainer');
        const countSpan = document.getElementById('searchResultCount');
        countSpan.textContent = `${results.length}个擂台`;
        
        if (results.length === 0) {
            container.innerHTML = `<div class="no-results">🔍 没有找到 "${escapeHtml(keyword)}" 相关的擂台</div>`;
        } else {
            container.innerHTML = results.map(c => {
                const stats = getCaseStats(c);
                const regex = new RegExp(`(${keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
                const highlightedTitle = c.title.replace(regex, `<mark class="search-keyword-highlight">$1</mark>`);
                return `<div class="card" data-id="${c.id}">
                    <div class="vs-title">${highlightedTitle}</div>
                    <div class="opinions">
                        <div class="opinion"><div class="role a">🔴 ${escapeHtml(stats.displayA)}</div><div class="text">${escapeHtml(c.sideA.text.substring(0, 55))}...</div></div>
                        <div class="opinion"><div class="role b">🔵 ${escapeHtml(stats.displayB)}</div><div class="text">${escapeHtml(c.sideB.text.substring(0, 55))}...</div></div>
                    </div>
                    <div class="stats">📊 ${(c.votes?.A || 0) + (c.votes?.B || 0)}人投票 &nbsp; 💬 ${c.comments?.length || 0}</div>
                    <div class="enter-detail">⚡ 查看AI裁判判决 →</div>
                </div>`;
            }).join('');
            
            container.querySelectorAll('.card[data-id]').forEach(el => {
                el.addEventListener('click', () => openDetail(el.dataset.id));
            });
        }
        
        document.getElementById('searchResultPage').classList.add('active');
    }
    
    function closeSearchResult() {
        document.getElementById('searchResultPage').classList.remove('active');
        currentSearchKeyword = "";
    }
    
    // ==================== 页面导航 ====================
    async function openDetail(id) {
        currentDetailCaseId = id;
        document.getElementById("caseDetailPage").classList.add("active");
        await renderCaseDetail(id);
        history.pushState({}, '', `?case=${id}`);
    }
    
    function closeDetail() {
        document.getElementById("caseDetailPage").classList.remove("active");
        currentDetailCaseId = null;
        history.pushState({}, '', window.location.pathname);
    }
    
    window.copyShareLink = (caseId) => {
        const url = `${window.location.origin}${window.location.pathname}?case=${caseId}`;
        navigator.clipboard.writeText(url);
        showToast("✅ 链接已复制");
    };
    
    // ==================== 创建擂台表单 ====================
    async function submitCase() {
        const title = document.getElementById("caseTitle").value.trim();
        const myRole = document.getElementById("myRole").value.trim() || "我方";
        const myView = document.getElementById("myView").value.trim();
        const oppRole = document.getElementById("opponentRole").value.trim() || "对方";
        const oppView = document.getElementById("opponentView").value.trim();
        
        if (!title || !myView || !oppView) {
            showToast("请完整填写双方观点");
            return;
        }
        
        const submitBtn = document.getElementById("submitCaseBtn");
        submitBtn.disabled = true;
        submitBtn.textContent = "⏳ AI分析中...";
        
        const newCase = await createCase(title, myRole, myView, oppRole, oppView);
        
        if (newCase) {
            document.getElementById("caseTitle").value = "";
            document.getElementById("myView").value = "";
            document.getElementById("opponentView").value = "";
            hideForm();
            await openDetail(newCase.id);
        }
        
        submitBtn.disabled = false;
        submitBtn.textContent = "🔥 提交 · AI将深度分析";
    }
    
    function showForm() { document.getElementById("createFormPage").classList.add("active"); }
    function hideForm() { document.getElementById("createFormPage").classList.remove("active"); }
    
    // ==================== 语音输入 ====================
    function initSpeechRecognition() {
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            return false;
        }
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = true;
        recognition.lang = 'zh-CN';
        
        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            if (currentRecordingTarget) {
                currentRecordingTarget.value = transcript;
                currentRecordingTarget.dispatchEvent(new Event('input'));
            }
            const btn = document.querySelector('.voice-input-btn.recording');
            if (btn) btn.classList.remove('recording');
            showToast(`✅ 已识别: ${transcript.substring(0, 30)}...`);
            currentRecordingTarget = null;
        };
        
        recognition.onerror = (event) => {
            const btn = document.querySelector('.voice-input-btn.recording');
            if (btn) btn.classList.remove('recording');
            if (event.error !== 'no-speech') {
                showToast(`语音识别失败: ${event.error}`);
            }
            currentRecordingTarget = null;
        };
        
        recognition.onend = () => {
            const btn = document.querySelector('.voice-input-btn.recording');
            if (btn) btn.classList.remove('recording');
            currentRecordingTarget = null;
        };
        
        return true;
    }
    
    function startVoiceInput(textareaId) {
        if (!recognition && !initSpeechRecognition()) {
            showToast("您的浏览器不支持语音输入");
            return;
        }
        
        const textarea = document.getElementById(textareaId);
        if (!textarea) return;
        
        currentRecordingTarget = textarea;
        const container = textarea.parentElement;
        const btn = container.querySelector('.voice-input-btn');
        if (btn) btn.classList.add('recording');
        
        try {
            recognition.start();
        } catch(e) {
            showToast("请允许麦克风权限");
            if (btn) btn.classList.remove('recording');
        }
    }
    
    function initVoiceButtons() {
        const myViewBtn = document.getElementById('voiceMyViewBtn');
        const oppViewBtn = document.getElementById('voiceOppViewBtn');
        if (myViewBtn) myViewBtn.addEventListener('click', () => startVoiceInput('myView'));
        if (oppViewBtn) oppViewBtn.addEventListener('click', () => startVoiceInput('opponentView'));
    }
    
    // ==================== 分类和排序 ====================
    function renderCategories() {
        const container = document.getElementById("categoryList");
        container.innerHTML = categoriesList.map(cat => `<div class="cat-item ${currentCategory === cat ? 'active' : ''}" data-cat="${cat}">${cat}</div>`).join('');
        document.querySelectorAll('.cat-item').forEach(el => {
            el.addEventListener('click', () => {
                currentCategory = el.dataset.cat;
                renderCategories();
                renderCases();
            });
        });
    }
    
    function bindTabs() {
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                currentSort = tab.dataset.sort;
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                renderCases();
            });
        });
    }
    
    function initSearchButton() {
        const searchBtn = document.getElementById('searchBtn');
        const searchInput = document.getElementById('searchInput');
        searchBtn.addEventListener('click', () => performSearch(searchInput.value.trim()));
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch(searchInput.value.trim());
        });
    }
    
    // ==================== URL 参数检查 ====================
    function checkUrlForCase() {
        const params = new URLSearchParams(window.location.search);
        const caseId = params.get('case');
        if (caseId) {
            setTimeout(() => {
                if (casesData.find(c => c.id === caseId)) {
                    openDetail(caseId);
                }
            }, 1000);
        }
    }
    
    // ==================== 初始化 ====================
    async function init() {
        await anonymousLogin();
        await loadUserVotes();
        subscribeToCases();
        renderCategories();
        bindTabs();
        initSearchButton();
        initVoiceButtons();
        checkUrlForCase();
        
        document.getElementById("openCreateModalBtn").addEventListener("click", showForm);
        document.getElementById("closeFormBtn").addEventListener("click", hideForm);
        document.getElementById("closeDetailBtn").addEventListener("click", closeDetail);
        document.getElementById("submitCaseBtn").addEventListener("click", submitCase);
        document.getElementById("closeSearchResultBtn").addEventListener("click", closeSearchResult);
        
        window.addEventListener('popstate', () => {
            const params = new URLSearchParams(window.location.search);
            const caseId = params.get('case');
            if (caseId && casesData.find(c => c.id === caseId)) {
                openDetail(caseId);
            } else {
                closeDetail();
            }
        });
        
        console.log("✅ 初始化完成");
    }
    
    // 挂载全局函数
    window.voteForCase = voteForCase;
    window.addComment = addComment;
    window.likeComment = likeComment;
    window.copyShareLink = copyShareLink;
    
    // 启动
    init();
</script>
</body>
