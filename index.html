<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>吵架擂台 · 真AI裁判 (DeepSeek)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        .app {
            max-width: 600px;
            margin: 0 auto;
            background-color: #000000;
            min-height: 100vh;
            color: #e7e7e7;
            padding-bottom: 80px;

        .header {
            position: sticky;
            top: 0;
            background-color: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(12px);

            border-bottom: 0.5px solid #2c2c2c;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #ff4d4d, #ff9f4d);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .ai-badge {
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 700;
            color: white;
        }

        /* 搜索栏样式 - 带搜索按钮 */
        .search-bar {
            padding: 12px 20px;
            border-bottom: 0.5px solid #2c2c2c;
        }
        .search-input-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
            background: #1a1a1a;
            border-radius: 30px;
            padding: 4px 16px;
            border: 0.5px solid #3a3a3a;
        }
        .search-input-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 12px 0;
            color: white;
            font-size: 15px;
            outline: none;
        }
        .search-input-wrapper input::placeholder {
            color: #71767b;
        }
        .search-input-wrapper button {
            background: linear-gradient(135deg, #ff4d4d, #ff7a45);
            border: none;
            padding: 8px 18px;
            border-radius: 30px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
        }

        /* 搜索结果页面 */
        .search-result-page {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000;
            z-index: 300;
            overflow-y: auto;
            display: none;
        }
        .search-result-page.active {
            display: block;
        }

            position: sticky;
            top: 0;
            background: rgba(0,0,0,0.96);
            backdrop-filter: blur(12px);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 0.5px solid #2c2c2c;
        }
        .search-result-header .back-btn {
            background: #1a1a1a;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            color: #ff7a45;
            border: none;
        }
        .search-result-header h2 {
            font-size: 18px;
            flex: 1;
        }
        .search-result-header .result-count {
            font-size: 13px;
            color: #a855f7;
        }
        .search-keyword-highlight {
            background: #ff7a45;
            color: black;
            border-radius: 4px;
            padding: 0 2px;
        }
        .no-search-results {
            text-align: center;
            padding: 60px 20px;
            color: #71767b;
        }

        .featured-badge {
            background: linear-gradient(135deg, #f59e0b, #ef4444);

            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            color: white;
            margin-left: 10px;

        .similar-cases-section {

        .similar-cases-title {

            font-weight: 700;
            margin-bottom: 12px;
            color: #a855f7;
        }

        .similar-case-item {

        .no-results { text-align: center; padding: 40px; color: #71767b; }

    </style>
</head>

    <div class="app">
        <div class="sub-header">
            <button class="form-back-btn" id="closeFormBtn">←</button>

        </div>

<script>
    // ============================================================
    // 🔑 DeepSeek API Key 配置
    // ============================================================
    const DEEPSEEK_API_KEY = "sk-c2bc3da4269d420fa2a794ccb4fe05b6";
    
    // ============================================================
    // 全局变量
    // ============================================================
    let casesData = [];
    let currentCategory = "全部";
    let currentSort = "hot";
    let currentDetailCaseId = null;
    let userVotesMap = new Map();
    
    // 语音识别相关
    let currentRecordingTarget = null;
    let recognition = null;
    
    // 每日精选缓存
    let dailyFeaturedCaseId = null;
    let lastFeaturedDate = null;
    
    // 当前搜索关键词（用于结果页高亮）
    let currentSearchKeyword = "";
    
    const categoriesList = ["全部", "感情观", "金钱观", "家事分工", "婆媳问题", "生活习惯", "社交界线", "其他"];
    
    // ==================== 辅助函数 ====================
    function showToast(message) {
        const existingToast = document.querySelector('.toast-message');
        if (existingToast) existingToast.remove();
        const toast = document.createElement('div');
        toast.className = 'toast-message';
        toast.textContent = message;
        document.body.appendChild(toast);
        setTimeout(() => { if(toast) toast.remove(); }, 2000);
    }
    
    function escapeHtml(str) { 
        if (!str) return ''; 
        return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])); 
    }
    
    function getUserId() {
        let userId = localStorage.getItem('user_id');
        if (!userId) {
            userId = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('user_id', userId);
        }
        return userId;
    }
    const currentUserId = getUserId();
    
    function getUserVote(caseId) {
        const votes = JSON.parse(localStorage.getItem('user_votes') || '{}');
        return votes[`${currentUserId}_${caseId}`] || null;
    }
    function saveUserVote(caseId, side) {
        const votes = JSON.parse(localStorage.getItem('user_votes') || '{}');
        votes[`${currentUserId}_${caseId}`] = side;
        localStorage.setItem('user_votes', JSON.stringify(votes));
    }
    function hasUserVoted(caseId) { return getUserVote(caseId) !== null; }
    function getUserVotedSide(caseId) { return getUserVote(caseId); }
    
    function getCaseStats(c) {
        const total = c.votes.A + c.votes.B;
        const aPercent = total === 0 ? 50 : (c.votes.A / total * 100).toFixed(0);
        const bPercent = total === 0 ? 50 : (c.votes.B / total * 100).toFixed(0);
        const displayA = c.hideGender ? "A方" : c.sideA.role;
        const displayB = c.hideGender ? "B方" : c.sideB.role;
        return { total, aPercent, bPercent, displayA, displayB };
    }
    
    // ==================== DeepSeek AI 调用 ====================
    async function callDeepSeekAI(sideAText, sideBText, roleA, roleB, title) {
        if (!DEEPSEEK_API_KEY || DEEPSEEK_API_KEY === "") {
            return {
                verdict: "⚠️ 请配置 DeepSeek API Key",
                suggestion: "在代码顶部设置 DEEPSEEK_API_KEY",
                error: true
            };
        }
        
        const prompt = `你是一位公正的吵架调解AI。请分析以下案例：

【题目】${title}
【${roleA}的观点】${sideAText}
【${roleB}的观点】${sideBText}

请用JSON格式输出：
{"verdict": "判决结果（200字以内，分析双方观点的合理性）", "suggestion": "和解建议（150字以内，给出具体可操作的建议）"}`;

        try {
            const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${DEEPSEEK_API_KEY}`
                },
                body: JSON.stringify({
                    model: 'deepseek-chat',
                    messages: [{ role: 'user', content: prompt }],
                    temperature: 0.7,
                    max_tokens: 800
                })
            });
            
            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error?.message || `HTTP ${response.status}`);
            }
            
            const data = await response.json();
            const content = data.choices[0].message.content;
            const jsonMatch = content.match(/\{[\s\S]*\}/);
            if (jsonMatch) {
                return JSON.parse(jsonMatch[0]);
            }
            return { verdict: content.substring(0, 300), suggestion: "建议双方多沟通" };
        } catch (error) {
            console.error("DeepSeek API 错误:", error);
            return { 
                verdict: `❌ AI分析失败: ${error.message}`, 
                suggestion: "请检查网络连接或API Key是否正确",
                error: true 
            };
        }
    }
    
    async function generateAIVerdictForCase(caseItem) {
        const roleA = caseItem.hideGender ? "A方" : caseItem.sideA.role;

    // ==================== 每日精选算法 ====================
    function calculateCaseScore(c) {
        const totalVotes = c.votes.A + c.votes.B;
        const aPercent = totalVotes === 0 ? 50 : (c.votes.A / totalVotes * 100);
        const intensity = totalVotes === 0 ? 0 : 100 - Math.abs(50 - aPercent);
        const commentScore = Math.min((c.comments?.length || 0) * 10, 50);
        const ageInDays = (Date.now() - c.createdAt) / (1000 * 60 * 60 * 24);
        const freshnessScore = Math.max(0, 100 - ageInDays * 15);
        const activityScore = Math.min(totalVotes * 2, 50);
        return intensity * 0.4 + commentScore * 0.2 + freshnessScore * 0.2 + activityScore * 0.2;
    }
    
    function selectDailyFeatured() {
        const today = new Date().toDateString();
        if (dailyFeaturedCaseId && lastFeaturedDate === today && casesData.find(c => c.id === dailyFeaturedCaseId)) {
            return casesData.find(c => c.id === dailyFeaturedCaseId);
        }
        if (!casesData.length) return null;
        const scored = casesData.map(c => ({ case: c, score: calculateCaseScore(c) }));
        scored.sort((a, b) => b.score - a.score);
        const now = Date.now();
        const selected = scored.find(s => (now - s.case.createdAt) > 3600000);
        if (selected) {
            dailyFeaturedCaseId = selected.case.id;
            lastFeaturedDate = today;
            return selected.case;
        }
        return scored[0]?.case || null;
    }

    // ==================== 相似擂台推荐 ====================
    function extractKeywords(text) {
        const stopwords = ['的', '了', '吗', '呢', '吧', '啊', '哦', '嗯', '怎么', '什么', '为什么', '可以', '应该', '觉得', '这个', '那个'];
        const words = text.split(/[，,。？?！!；;：:\s]+/);
        const filtered = words.filter(w => w.length >= 2 && !stopwords.includes(w));
        return [...new Set(filtered)].slice(0, 4);
    }
    
    function findSimilarCases(currentCase, limit = 3) {
        if (!casesData.length || casesData.length <= 1) return [];
        const keywords = extractKeywords(currentCase.title);
        const category = currentCase.category;
        const scored = casesData.filter(c => c.id !== currentCase.id).map(c => {
            let score = 0;
            if (c.category === category && category !== "其他") score += 30;
            const titleLower = c.title.toLowerCase();
            for (const kw of keywords) {
                if (titleLower.includes(kw)) score += 15;
            }
            const totalVotes = c.votes.A + c.votes.B;
            score += Math.min(totalVotes, 20);
            score += Math.min((c.comments?.length || 0) * 2, 15);
            return { case: c, score };
        });
        scored.sort((a, b) => b.score - a.score);
        return scored.slice(0, limit).map(s => s.case);
    }
    
    function renderSimilarCases(currentCase) {
        const similar = findSimilarCases(currentCase, 3);
        if (!similar.length) return '';
        return `
            <div class="similar-cases-section">
                <div class="similar-cases-title">🔗 相似擂台推荐</div>
                ${similar.map(c => {
                    const stats = getCaseStats(c);
                    return `
                        <div class="similar-case-item" data-id="${c.id}">
                            <div class="similar-case-title">${escapeHtml(c.title)}</div>
                            <div class="similar-case-stats">
                                🔴 ${escapeHtml(stats.displayA)} ${c.votes.A}票 vs 🔵 ${escapeHtml(stats.displayB)} ${c.votes.B}票
                                &nbsp;| 💬 ${c.comments?.length || 0}
                            </div>
                        </div>
                    `;
                }).join('')}
            </div>
        `;
    }
    
    // ==================== 投票和评论 ====================
    window.voteForCase = async (id, side) => {
        const c = casesData.find(c => c.id === id);
        if (!c) return;
        if (hasUserVoted(id)) {
            const votedSide = getUserVotedSide(id);
            const sideName = votedSide === 'A' ? (c.hideGender ? 'A方' : c.sideA.role) : (c.hideGender ? 'B方' : c.sideB.role);
            showToast(`⚠️ 已经支持过 ${sideName}，不能改票`);
            return;
        }
        c.votes[side]++;
        saveUserVote(id, side);
        saveDataToLocal();
        const sideName = side === 'A' ? (c.hideGender ? 'A方' : c.sideA.role) : (c.hideGender ? 'B方' : c.sideB.role);
        showToast(`✅ 支持了 ${sideName}`);
        if (currentDetailCaseId === id) await renderCaseDetail(id);
        renderCases();
        renderDailyFeatured();
        // 如果搜索结果页开着，也刷新
        if (document.getElementById('searchResultPage').classList.contains('active')) {
            performSearch(currentSearchKeyword);
        }
    };
    
    window.addComment = async (id) => {
        const ta = document.getElementById(`comment-${id}`);
        if (!ta.value.trim()) return;
        const c = casesData.find(c => c.id === id);
        if (c) {
            c.comments = c.comments || [];
            c.comments.push({ text: ta.value.trim(), likes: 0, created_at: Date.now() });
            ta.value = '';
            saveDataToLocal();
            if (currentDetailCaseId === id) await renderCaseDetail(id);
            renderCases();
            renderDailyFeatured();
        }

    // ==================== 搜索功能（独立页面）====================
    function performSearch(keyword) {
        currentSearchKeyword = keyword;
        if (!keyword.trim()) {
            showToast("请输入搜索关键词");
            return;
        }
        
        // 过滤搜索结果
        const results = casesData.filter(c => 
            c.title.toLowerCase().includes(keyword.toLowerCase())
        );
        
        // 更新结果页
        const container = document.getElementById('searchResultContainer');
        const countSpan = document.getElementById('searchResultCount');
        countSpan.textContent = `${results.length}个擂台`;
        
        if (results.length === 0) {
            container.innerHTML = `
                <div class="no-search-results">
                    🔍 没有找到 "${escapeHtml(keyword)}" 相关的擂台<br>
                    试试其他关键词吧~
                </div>
            `;
        } else {
            container.innerHTML = results.map(c => {
                const stats = getCaseStats(c);
                const hasVoted = hasUserVoted(c.id);
                const voteDisplay = hasVoted ? `📊 ${stats.aPercent}% : ${stats.bPercent}%` : `🔒 投票后可见结果`;
                // 高亮关键词
                const regex = new RegExp(`(${keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
                const highlightedTitle = c.title.replace(regex, `<mark class="search-keyword-highlight">$1</mark>`);
                
                return `<div class="card" data-id="${c.id}">
                    <div class="vs-title">${highlightedTitle}</div>
                    <div class="opinions">
                        <div class="opinion"><div class="role a">🔴 ${escapeHtml(stats.displayA)}</div><div class="text">${escapeHtml(c.sideA.text.substring(0, 55))}...</div></div>
                        <div class="opinion"><div class="role b">🔵 ${escapeHtml(stats.displayB)}</div><div class="text">${escapeHtml(c.sideB.text.substring(0, 55))}...</div></div>
                    </div>
                    <div class="stats">${voteDisplay} &nbsp; 💬 ${c.comments?.length || 0}</div>
                    <div class="enter-detail">⚡ 查看AI裁判判决 →</div>
                </div>`;
            }).join('');
            
            // 绑定点击事件
            container.querySelectorAll('.card[data-id]').forEach(el => {
                el.addEventListener('click', () => {
                    openDetail(el.dataset.id);
                });
            });
        }
        
        // 显示搜索结果页
        document.getElementById('searchResultPage').classList.add('active');
    }

        document.getElementById('searchResultPage').classList.remove('active');

            filtered.sort((a, b) => (b.votes.A + b.votes.B) - (a.votes.A + a.votes.B));
        } else {
            filtered.sort((a, b) => b.createdAt - a.createdAt);
        }
        
        const container = document.getElementById("caseListContainer");

            container.innerHTML = `<div class="no-results">⚡ 暂无擂台，发起一个吧</div>`;

        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            console.warn("浏览器不支持语音识别");
            return false;
        }
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = 'zh-CN';
        
        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            if (currentRecordingTarget) {
                currentRecordingTarget.value = transcript;
                currentRecordingTarget.dispatchEvent(new Event('input'));
            }
            const btn = document.querySelector('.voice-input-btn.recording');
            if (btn) btn.classList.remove('recording');
            showToast(`✅ 已识别: ${transcript.substring(0, 30)}...`);
            currentRecordingTarget = null;
        };
        
        recognition.onerror = (event) => {
            console.error("语音识别错误:", event.error);
            const btn = document.querySelector('.voice-input-btn.recording');
            if (btn) btn.classList.remove('recording');
            if (event.error !== 'no-speech') {
                showToast(`❌ 语音识别失败: ${event.error}`);
            }
            currentRecordingTarget = null;
        };
        
        recognition.onend = () => {
            const btn = document.querySelector('.voice-input-btn.recording');
            if (btn) btn.classList.remove('recording');
            currentRecordingTarget = null;
        };
        
        return true;
    }
    
    function startVoiceInput(textareaId) {
        if (!recognition) {
            if (!initSpeechRecognition()) {
                showToast("您的浏览器不支持语音输入，请使用 Chrome 或 Edge");
                return;
            }
        }
        
        const textarea = document.getElementById(textareaId);
        if (!textarea) return;
        
        currentRecordingTarget = textarea;
        const container = textarea.parentElement;
        const btn = container.querySelector('.voice-input-btn');
        if (btn) btn.classList.add('recording');
        
        try {
            recognition.start();
        } catch(e) {
            showToast("请允许麦克风权限");
            if (btn) btn.classList.remove('recording');
        }
    }
    
    function initVoiceButtons() {
        const myViewBtn = document.getElementById('voiceMyViewBtn');
        const oppViewBtn = document.getElementById('voiceOppViewBtn');
        if (myViewBtn) myViewBtn.addEventListener('click', () => startVoiceInput('myView'));
        if (oppViewBtn) oppViewBtn.addEventListener('click', () => startVoiceInput('opponentView'));
    }
    
    // ==================== 提交新擂台 ====================
    async function submitCase() {
        const title = document.getElementById("caseTitle").value.trim();
        const myRole = document.getElementById("myRole").value.trim() || "我方";
        const myView = document.getElementById("myView").value.trim();
        const oppRole = document.getElementById("opponentRole").value.trim() || "对方";
        const oppView = document.getElementById("opponentView").value.trim();
        
        if (!title || !myView || !oppView) {
            alert("请完整填写双方观点");
            return;
        }
        
        const submitBtn = document.getElementById("submitCaseBtn");
        submitBtn.disabled = true;
        submitBtn.textContent = "⏳ AI分析中...";
        
        const newCase = {
            id: Date.now().toString(),
            title: title,
            category: "其他",
            hideGender: false,
            sideA: { role: myRole, text: myView },
            sideB: { role: oppRole, text: oppView },
            votes: { A: 0, B: 0 },
            comments: [],
            createdAt: Date.now(),
            aiVerdict: null
        };
        
        casesData.unshift(newCase);
        saveDataToLocal();
        hideForm();
        
        showToast("🤖 AI裁判分析中...");
        await generateAIVerdictForCase(newCase);
        saveDataToLocal();
        
        renderCases();
        renderDailyFeatured();
        await openDetail(newCase.id);
        
        document.getElementById("caseTitle").value = "";
        document.getElementById("myView").value = "";
        document.getElementById("opponentView").value = "";
        submitBtn.disabled = false;
        submitBtn.textContent = "🔥 提交 · AI将深度分析";
        
        showToast("✅ 擂台创建成功！");
    }
    
    // ==================== 检查URL参数 ====================
    function checkUrlForCase() {
        const urlParams = new URLSearchParams(window.location.search);
        const caseId = urlParams.get('case');
        if (caseId && casesData.find(c => c.id === caseId)) {
            setTimeout(() => openDetail(caseId), 300);
        }
    }
    
    // ==================== 初始化搜索按钮 ====================
    function initSearchButton() {
        const searchBtn = document.getElementById('searchBtn');
        const searchInput = document.getElementById('searchInput');
        
        searchBtn.addEventListener('click', () => {
            const keyword = searchInput.value.trim();
            if (keyword) {
                performSearch(keyword);
            } else {
                showToast("请输入搜索关键词");
            }
        });
        
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const keyword = searchInput.value.trim();
                if (keyword) {
                    performSearch(keyword);
                }
            }
        });
    }
    
    // ==================== 初始化 ====================
    function init() {
        // 加载数据
        const hasData = loadDataFromLocal();
        if (!hasData) {
            initSampleData();
        }
        
        // 为现有案例生成 AI 判决（如果需要）
        casesData.forEach(async (c) => {
            if (!c.aiVerdict) {
                await generateAIVerdictForCase(c);
                saveDataToLocal();
                if (currentDetailCaseId === c.id) {
                    await renderCaseDetail(c.id);
                }
                renderCases();
            }
        });
        
        // 渲染页面
        renderCategories();
        renderCases();
        renderDailyFeatured();
        bindTabs();
        initSpeechRecognition();
        initVoiceButtons();
        initSearchButton();
        checkUrlForCase();
        
        // 绑定事件
        document.getElementById("openCreateModalBtn").addEventListener("click", showForm);
        document.getElementById("closeFormBtn").addEventListener("click", hideForm);
        document.getElementById("closeDetailBtn").addEventListener("click", closeDetail);
        document.getElementById("submitCaseBtn").addEventListener("click", submitCase);
        document.getElementById("closeSearchResultBtn").addEventListener("click", closeSearchResult);
        
        // 监听浏览器前进后退
        window.addEventListener('popstate', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const caseId = urlParams.get('case');
            if (caseId && casesData.find(c => c.id === caseId)) {
                openDetail(caseId);
            } else {
                closeDetail();
            }
        });
        
        console.log("初始化完成，共加载", casesData.length, "个擂台");
    }
    
    // 挂载全局函数
    window.voteForCase = voteForCase;
    window.addComment = addComment;
    window.likeComment = likeComment;
    window.refreshAIDetail = refreshAIDetail;
    window.copyShareLink = copyShareLink;
    
    // 启动应用
    init();
</script>
