<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>吵架擂台 · 真AI裁判 (DeepSeek)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        .app {
            max-width: 600px;
            margin: 0 auto;
            background-color: #000000;
            min-height: 100vh;
            color: #e7e7e7;
            padding-bottom: 80px;
        }

        .header {
            position: sticky;
            top: 0;
            background-color: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(12px);
            padding: 12px 20px;
            border-bottom: 0.5px solid #2c2c2c;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #ff4d4d, #ff9f4d);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .ai-badge {
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 700;
            color: white;
        }

        /* 搜索栏样式 */
        .search-bar {
            padding: 12px 20px;
            border-bottom: 0.5px solid #2c2c2c;
        }

        .search-input-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
            background: #1a1a1a;
            border-radius: 30px;
            padding: 4px 16px;
            border: 0.5px solid #3a3a3a;
        }

        .search-input-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 12px 0;
            color: white;
            font-size: 15px;
            outline: none;
        }

        .search-input-wrapper input::placeholder {
            color: #71767b;
        }

        .search-clear {
            background: none;
            border: none;
            color: #71767b;
            cursor: pointer;
            font-size: 18px;
            padding: 4px 8px;
            display: none;
        }

        .search-clear.visible {
            display: block;
        }

        .create-btn-wrap {
            padding: 14px 20px 8px;
        }

        .create-btn {
            background: linear-gradient(135deg, #ff4d4d 0%, #ff7a45 100%);
            color: white;
            border: none;
            padding: 14px 18px;
            border-radius: 28px;
            font-weight: 700;
            width: 100%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: opacity 0.2s, transform 0.1s;
        }

        .create-btn:active {
            transform: scale(0.97);
        }

        .categories {
            padding: 12px 20px;
            display: flex;
            gap: 10px;
            overflow-x: auto;
            border-bottom: 0.5px solid #2c2c2c;
            scrollbar-width: thin;
        }

        .cat-item {
            background: #1a1a1a;
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 14px;
            color: #b0b0b0;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.1s;
        }

        .cat-item.active {
            background: #ffffff;
            color: #000000;
            font-weight: 600;
        }

        .tabs {
            display: flex;
            gap: 28px;
            padding: 12px 20px;
            border-bottom: 0.5px solid #2c2c2c;
        }

        .tab {
            font-size: 16px;
            font-weight: 600;
            color: #71767b;
            cursor: pointer;
            padding-bottom: 8px;
        }

        .tab.active {
            color: #ff7a45;
            border-bottom: 2px solid #ff7a45;
        }

        .card {
            background-color: #121212;
            margin: 14px 20px;
            border-radius: 28px;
            padding: 18px;
            border: 0.5px solid #2a2a2a;
            cursor: pointer;
            transition: transform 0.1s ease, border 0.2s;
        }

        .card:active {
            transform: scale(0.98);
        }

        .vs-title {
            font-size: 20px;
            font-weight: 800;
            margin: 8px 0;
            line-height: 1.3;
        }

        .opinions {
            display: flex;
            gap: 12px;
            margin: 14px 0;
        }

        .opinion {
            flex: 1;
            background: #1a1a1a;
            padding: 14px;
            border-radius: 24px;
        }

        .role.a { color: #ff6b6b; font-weight: 800; margin-bottom: 8px; font-size: 15px; }
        .role.b { color: #4d9fff; font-weight: 800; margin-bottom: 8px; font-size: 15px; }

        .opinion .text {
            font-size: 13px;
            line-height: 1.4;
            color: #cdcdcd;
        }

        .ai-verdict {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 24px;
            padding: 16px;
            margin: 16px 0;
            border: 1px solid #7c3aed40;
        }

        .ai-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .ai-icon {
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .verdict-text {
            font-size: 14px;
            line-height: 1.5;
            color: #cbd5e1;
            white-space: pre-wrap;
        }

        .ai-suggestion {
            background: #0f0f1a;
            border-radius: 16px;
            padding: 12px;
            margin-top: 12px;
            font-size: 13px;
            border-left: 3px solid #a855f7;
        }

        .ai-btn {
            background: #7c3aed20;
            border: 1px solid #7c3aed;
            color: #a855f7;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 12px;
            cursor: pointer;
            margin-top: 12px;
            transition: 0.2s;
        }

        .ai-btn:active {
            background: #7c3aed40;
        }

        .vote-area {
            display: flex;
            gap: 12px;
            margin: 14px 0;
        }

        .vote-btn {
            flex: 1;
            background: #252525;
            border: none;
            padding: 12px;
            border-radius: 44px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .vote-btn:active {
            transform: scale(0.97);
        }

        .vote-btn.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .vote-btn.a-vote { background: #3e2020; border: 0.5px solid #ff6b6b; }
        .vote-btn.b-vote { background: #1f2c3a; border: 0.5px solid #4d9fff; }

        .vote-stats {
            background: #0d0d0d;
            border-radius: 20px;
            padding: 14px;
            margin-top: 12px;
            text-align: center;
        }

        .vote-stats-hidden {
            background: #0d0d0d;
            border-radius: 20px;
            padding: 14px;
            margin-top: 12px;
            text-align: center;
            color: #71767b;
            border: 0.5px dashed #3a3a3a;
        }

        .vote-bar {
            display: flex;
            height: 8px;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }

        .vote-bar-a {
            background: #ff6b6b;
            transition: width 0.3s;
        }
        .vote-bar-b {
            background: #4d9fff;
            transition: width 0.3s;
        }

        .vote-numbers {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 13px;
            font-weight: 600;
        }
        .vote-numbers .a { color: #ff6b6b; }
        .vote-numbers .b { color: #4d9fff; }

        .my-vote-badge {
            background: #ff7a45;
            color: black;
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 8px;
            font-weight: 700;
        }

        .stats {
            display: flex;
            gap: 18px;
            font-size: 12px;
            color: #71767b;
            margin-top: 12px;
        }

        .enter-detail {
            margin-top: 14px;
            text-align: center;
            color: #ff7a45;
            font-weight: 600;
            font-size: 13px;
        }

        /* 分享按钮组 */
        .share-buttons {
            display: flex;
            gap: 10px;
            margin: 16px 0 8px;
        }

        .share-btn {
            flex: 1;
            background: #1a1a1a;
            border: 0.5px solid #3a3a3a;
            padding: 10px;
            border-radius: 30px;
            color: #a855f7;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .share-btn:active {
            transform: scale(0.97);
            background: #252525;
        }

        .detail-page, .form-page {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000;
            z-index: 200;
            overflow-y: auto;
            display: none;
        }

        .detail-page.active, .form-page.active { display: block; }

        .sub-header {
            position: sticky;
            top: 0;
            background: rgba(0,0,0,0.94);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(8px);
            border-bottom: 0.5px solid #2c2c2c;
        }

        .form-back-btn {
            background: #1a1a1a;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            cursor: pointer;
            color: #ff7a45;
            border: none;
        }

        .form-input, .form-textarea {
            width: 100%;
            background: #1c1c1c;
            border: 0.5px solid #3a3a3a;
            border-radius: 20px;
            padding: 14px;
            color: white;
            margin-bottom: 12px;
            font-family: inherit;
            font-size: 15px;
        }

        .form-side {
            background: #181818;
            border-radius: 24px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .form-footer {
            position: fixed;
            bottom: 0;
            padding: 14px 20px;
            background: linear-gradient(to top, #000 85%, transparent);
            max-width: 600px;
            width: 100%;
        }

        .submit-btn {
            background: linear-gradient(135deg, #ff4d4d, #ff9f4d);
            width: 100%;
            padding: 16px;
            border-radius: 32px;
            color: white;
            font-weight: 800;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s;
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .comment-section {
            margin-top: 20px;
            background: #0c0c0c;
            border-radius: 24px;
            padding: 16px;
        }

        .comment-section textarea {
            width: 100%;
            background: #1c1c1c;
            border-radius: 20px;
            padding: 12px;
            color: white;
            margin-top: 12px;
            border: 0.5px solid #3a3a3a;
            font-family: inherit;
        }

        .small-btn {
            background: #ff7a45;
            border: none;
            padding: 8px 18px;
            border-radius: 40px;
            color: black;
            font-weight: 700;
            margin-top: 10px;
            cursor: pointer;
        }

        .like-btn {
            background: none;
            border: none;
            color: #ff6b6b;
            cursor: pointer;
            font-size: 12px;
            margin-left: 8px;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.96);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
        }

        .loading-overlay .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid #7c3aed;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .toast-message {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: #ff7a45;
            color: black;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            z-index: 1100;
            animation: fadeOut 2s ease forwards;
            white-space: nowrap;
            max-width: 80%;
            text-align: center;
            white-space: normal;
        }

        @keyframes fadeOut {
            0% { opacity: 1; transform: translateX(-50%) translateY(0); }
            70% { opacity: 1; }
            100% { opacity: 0; transform: translateX(-50%) translateY(20px); visibility: hidden; }
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: #71767b;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <h1>🥊 吵架擂台</h1>
        <div class="ai-badge">🤖 DeepSeek AI 裁判</div>
    </div>

    <!-- 搜索栏 -->
    <div class="search-bar">
        <div class="search-input-wrapper">
            <span>🔍</span>
            <input type="text" id="searchInput" placeholder="搜索擂台标题..." autocomplete="off">
            <button class="search-clear" id="searchClearBtn">✕</button>
        </div>
    </div>

    <div class="create-btn-wrap">
        <button class="create-btn" id="openCreateModalBtn">⚡ 发起擂台 · AI裁判</button>
    </div>

    <div class="categories" id="categoryList"></div>
    <div class="tabs">
        <div class="tab active" data-sort="hot">🔥 热门</div>
        <div class="tab" data-sort="new">✨ 最新</div>
    </div>
    <div id="caseListContainer"></div>
</div>

<div id="caseDetailPage" class="detail-page">
    <div class="app">
        <div class="sub-header">
            <button class="form-back-btn" id="closeDetailBtn">←</button>
            <h2>AI 裁判分析</h2>
        </div>
        <div id="caseDetailContainer"></div>
    </div>
</div>

<div id="createFormPage" class="form-page">
    <div class="app">
        <div class="sub-header">
            <button class="form-back-btn" id="closeFormBtn">←</button>
            <h2>🥊 发起擂台</h2>
        </div>
        <div class="form-container" style="padding: 16px;">
            <input class="form-input" id="caseTitle" placeholder="擂台标题 (ex: 过年该去谁家？)" maxlength="60">
            <div class="form-side">
                <div class="role a">🔴 我方立场</div>
                <input class="form-input" id="myRole" placeholder="称呼 (ex: 男友)" value="我方">
                <textarea class="form-textarea" id="myView" rows="4" placeholder="描述你的观点、理由、感受... (越详细AI分析越精准)"></textarea>
            </div>
            <div class="form-side">
                <div class="role b">🔵 对方立场</div>
                <input class="form-input" id="opponentRole" placeholder="称呼 (ex: 女友)" value="对方">
                <textarea class="form-textarea" id="opponentView" rows="4" placeholder="描述对方的观点、理由..."></textarea>
            </div>
        </div>
        <div class="form-footer">
            <button class="submit-btn" id="submitCaseBtn">🔥 提交 · AI将深度分析</button>
        </div>
    </div>
</div>

<script>
    // ============================================================
    // 🔑 DeepSeek API Key (请使用者替换为自己的真实Key)
    // 免费获取: https://platform.deepseek.com/api_keys
    // ============================================================
    const DEEPSEEK_API_KEY = "sk-bf31351663664bb0b867bfcbcbdbc771";
    // ============================================================

    let cases = [];
    let currentCategory = "全部";
    let currentSort = "hot";
    let currentDetailCaseId = null;
    let currentSearchKeyword = "";

    const categoriesList = ["全部", "感情观", "金钱观", "家事分工", "婆媳问题", "生活习惯", "社交界线", "其他"];

    function getUserId() {
        let userId = localStorage.getItem('user_id');
        if (!userId) {
            userId = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('user_id', userId);
        }
        return userId;
    }
    const currentUserId = getUserId();

    function getUserVote(caseId) {
        const votes = JSON.parse(localStorage.getItem('user_votes') || '{}');
        return votes[`${currentUserId}_${caseId}`] || null;
    }
    function saveUserVote(caseId, side) {
        const votes = JSON.parse(localStorage.getItem('user_votes') || '{}');
        votes[`${currentUserId}_${caseId}`] = side;
        localStorage.setItem('user_votes', JSON.stringify(votes));
    }
    function hasUserVoted(caseId) { return getUserVote(caseId) !== null; }
    function getUserVotedSide(caseId) { return getUserVote(caseId); }

    function showToast(message) {
        const existingToast = document.querySelector('.toast-message');
        if (existingToast) existingToast.remove();
        const toast = document.createElement('div');
        toast.className = 'toast-message';
        toast.textContent = message;
        document.body.appendChild(toast);
        setTimeout(() => { if(toast) toast.remove(); }, 2000);
    }

    window.voteForCase = (id, side) => {
        const c = cases.find(c => c.id === id);
        if (!c) return;
        if (hasUserVoted(id)) {
            const votedSide = getUserVotedSide(id);
            const sideName = votedSide === 'A' ? (c.hideGender ? 'A方' : c.sideA.role) : (c.hideGender ? 'B方' : c.sideB.role);
            showToast(`⚠️ 已经支持过 ${sideName}，不能改票`);
            return;
        }
        c.votes[side]++;
        saveData();
        saveUserVote(id, side);
        const sideName = side === 'A' ? (c.hideGender ? 'A方' : c.sideA.role) : (c.hideGender ? 'B方' : c.sideB.role);
        showToast(`✅ 支持了 ${sideName}`);
        refreshDetail(id);
        renderCases();
    };

    // ==================== 分享功能实现 ====================
    function getCaseShareUrl(caseId) {
        const url = new URL(window.location.href);
        url.searchParams.set('case', caseId);
        return url.toString();
    }

    async function copyShareLink(caseId) {
        const shareUrl = getCaseShareUrl(caseId);
        try {
            await navigator.clipboard.writeText(shareUrl);
            showToast('✅ 链接已复制！可以分享给朋友来评理啦');
        } catch (err) {
            // 降级方案
            const textarea = document.createElement('textarea');
            textarea.value = shareUrl;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            showToast('✅ 链接已复制！可以分享给朋友来评理啦');
        }
    }

    function generateShareText(c) {
        const stats = getCaseStats(c);
        const totalVotes = c.votes.A + c.votes.B;
        const voteInfo = totalVotes > 0 ? `当前票数：${stats.displayA} ${c.votes.A}票 : ${c.votes.B}票 ${stats.displayB}` : '快来投票支持你认可的一方！';
        const aiPreview = c.aiVerdict ? c.aiVerdict.verdict.substring(0, 80) + '...' : 'AI裁判正在分析中...';
        return `【吵架擂台】${c.title}\n\n🔴 ${stats.displayA}：${c.sideA.text.substring(0, 50)}...\n🔵 ${stats.displayB}：${c.sideB.text.substring(0, 50)}...\n\n🤖 AI裁判：${aiPreview}\n\n${voteInfo}\n\n来当公正的裁判吧！`;
    }

    async function copyShareText(caseId) {
        const c = cases.find(c => c.id === caseId);
        if (!c) return;
        const shareText = generateShareText(c);
        try {
            await navigator.clipboard.writeText(shareText);
            showToast('✅ 文本已复制！可以粘贴分享给朋友');
        } catch (err) {
            const textarea = document.createElement('textarea');
            textarea.value = shareText;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            showToast('✅ 文本已复制！可以粘贴分享给朋友');
        }
    }

    // 解析URL参数，自动打开对应的案例
    function checkUrlForCase() {
        const urlParams = new URLSearchParams(window.location.search);
        const caseId = urlParams.get('case');
        if (caseId) {
            const targetCase = cases.find(c => c.id === caseId);
            if (targetCase) {
                setTimeout(() => {
                    openDetail(caseId);
                }, 300);
            }
        }
    }

    // ==================== 搜索功能实现 ====================
    function initSearch() {
        const searchInput = document.getElementById('searchInput');
        const searchClearBtn = document.getElementById('searchClearBtn');
        
        searchInput.addEventListener('input', (e) => {
            currentSearchKeyword = e.target.value.trim();
            if (currentSearchKeyword) {
                searchClearBtn.classList.add('visible');
            } else {
                searchClearBtn.classList.remove('visible');
            }
            renderCases();
        });
        
        searchClearBtn.addEventListener('click', () => {
            searchInput.value = '';
            currentSearchKeyword = '';
            searchClearBtn.classList.remove('visible');
            renderCases();
        });
    }

    function loadData() {
        const saved = localStorage.getItem('cases');
        if (saved && saved !== '[]') {
            cases = JSON.parse(saved);
        } else {
            cases = [
                {
                    id: "sample1",
                    title: "另一半偷偷看我的手机，该原谅吗？",
                    category: "感情观",
                    hideGender: false,
                    sideA: { role: "老婆", text: "我发现你趁我洗澡的时候翻我手机，看了我的微信聊天记录和相册。这不是第一次了，上次你说不会再犯，结果今天又被我抓到。两个人在一起最重要的就是信任，你这样做让我觉得自己像个犯人，随时被监视。我又没有做对不起你的事，你为什么要这样？如果你有什么不安，可以直接问我，而不是用这种方式。这次我真的很难过，感觉我们的信任基础被你亲手破坏了。" },
                    sideB: { role: "老公", text: "我知道翻你手机不对，但我真的是因为太在乎你了。上次看到你和一个男同事聊天很频繁，我就一直心里不舒服，但又不敢问，怕你觉得我小心眼。我只是想确认一下，没有别的意思。我知道我错了，但这不也是因为爱你才这样吗？而且我也没有做什么过分的事，就翻了翻，又没删除什么。你就不能理解一下我的心情吗？我保证这是最后一次，真的。" },
                    votes: { A: 0, B: 0 },
                    comments: [],
                    createdAt: Date.now() - 86400000,
                    aiVerdict: null
                },
                {
                    id: "sample2",
                    title: "我年薪200万，该不该帮月薪4万的男友还房贷？",
                    category: "金钱观",
                    hideGender: false,
                    sideA: { role: "女友", text: "我年薪200万，男友月薪只有4万。我们交往两年了，他去年买了房，每月房贷要缴3万5，他薪水扣掉房贷只剩5千块，连基本生活都有问题。他最近开口希望我帮他还房贷，说反正你赚那么多，我们以后要结婚，房子也是我们一起住。我不是不愿意帮忙，但我觉得他应该自己承担自己的选择。当初买房时也没跟我商量，现在却要我出钱。而且我担心一旦开始帮他还，以后就变成理所当然。我可以负担约会开销，也可以出生活费，但房贷是他名下的资产，我真的该帮他出吗？" },
                    sideB: { role: "男友", text: "我真的觉得很委屈。你知道我买这个房子是为了我们的未来，虽然薪水不高，但我拼命工作也想给你一个家。现在房贷压力这么大，我每天只敢吃60块的便当，连机车坏了都不敢修。你年薪200万，买一个包就十几万，帮我还一点房贷对你来说真的那么难吗？我们不是说好要结婚的吗？那这个家不也是你的家吗？我不是要你全部负担，只是希望你体谅一下。看到你每天过得那么轻松，我却快被房贷压垮，这种感觉真的很差。如果你真的爱我，应该愿意一起承担吧？" },
                    votes: { A: 0, B: 0 },
                    comments: [],
                    createdAt: Date.now(),
                    aiVerdict: null
                }
            ];
            saveData();
        }
    }
    function saveData() { localStorage.setItem('cases', JSON.stringify(cases)); }

    function showLoading(message) {
        let overlay = document.getElementById('loadingOverlay');
        if (!overlay) {
            overlay = document.createElement('div');
            overlay.id = 'loadingOverlay';
            overlay.className = 'loading-overlay';
            overlay.innerHTML = `<div class="spinner"></div><p>${message}</p>`;
            document.body.appendChild(overlay);
        } else {
            overlay.style.display = 'flex';
            overlay.querySelector('p').textContent = message;
        }
    }
    function hideLoading() {
        const overlay = document.getElementById('loadingOverlay');
        if (overlay) overlay.style.display = 'none';
    }

    async function callDeepSeekAI(sideAText, sideBText, roleA, roleB, title) {
        if (!DEEPSEEK_API_KEY || DEEPSEEK_API_KEY === "YOUR_API_KEY_HERE" || DEEPSEEK_API_KEY === "sk-6537f2c663b2444884ce44a38e751ab0") {
            return {
                verdict: "⚡ 演示模式：请前往DeepSeek官网获取免费API Key并填入代码顶部，即可获得真正的AI裁判分析。当前为示例分析：双方都有情绪，建议冷静沟通。",
                suggestion: "1. 使用「我讯息」表达感受 2. 避免翻旧账 3. 寻找共同目标。",
                error: true
            };
        }
        const prompt = `你是一位公正的吵架调解AI。请分析以下案例：

【题目】${title}
【${roleA}的观点】${sideAText}
【${roleB}的观点】${sideBText}

请用JSON格式输出：
{"verdict": "判决结果（200字以内）", "suggestion": "和解建议（150字以内）"}`;

        try {
            const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${DEEPSEEK_API_KEY}` },
                body: JSON.stringify({ model: 'deepseek-chat', messages: [{ role: 'user', content: prompt }], temperature: 0.7, max_tokens: 800 })
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error?.message || 'API错误');
            const content = data.choices[0].message.content;
            const jsonMatch = content.match(/\{[\s\S]*\}/);
            if (jsonMatch) return JSON.parse(jsonMatch[0]);
            return { verdict: content.substring(0, 300), suggestion: "建议双方多聆听彼此需求" };
        } catch (error) {
            return { verdict: `❌ AI分析暂不可用: ${error.message}`, suggestion: "请稍后重试或检查API Key" };
        }
    }

    async function generateAIVerdictForCase(caseItem) {
        const roleA = caseItem.hideGender ? "A方" : caseItem.sideA.role;
        const roleB = caseItem.hideGender ? "B方" : caseItem.sideB.role;
        const result = await callDeepSeekAI(caseItem.sideA.text, caseItem.sideB.text, roleA, roleB, caseItem.title);
        caseItem.aiVerdict = result;
        saveData();
        return result;
    }

    function getCaseStats(c) {
        const total = c.votes.A + c.votes.B;
        const aPercent = total === 0 ? 50 : (c.votes.A / total * 100).toFixed(0);
        const bPercent = total === 0 ? 50 : (c.votes.B / total * 100).toFixed(0);
        const displayA = c.hideGender ? "A方" : c.sideA.role;
        const displayB = c.hideGender ? "B方" : c.sideB.role;
        return { total, aPercent, bPercent, displayA, displayB };
    }

    function renderVoteArea(c, stats, hasVoted, userVotedSide) {
        if (hasVoted) {
            const aWidth = stats.total === 0 ? 50 : (c.votes.A / stats.total * 100);
            const bWidth = stats.total === 0 ? 50 : (c.votes.B / stats.total * 100);
            const votedText = userVotedSide === 'A' ? `你支持了 ${stats.displayA}` : `你支持了 ${stats.displayB}`;
            return `
                <div class="vote-stats">
                    <div class="vote-bar"><div class="vote-bar-a" style="width: ${aWidth}%;"></div><div class="vote-bar-b" style="width: ${bWidth}%;"></div></div>
                    <div class="vote-numbers"><span class="a">🔥 ${stats.displayA}: ${c.votes.A}票 (${stats.aPercent}%)</span><span class="b">💧 ${stats.displayB}: ${c.votes.B}票 (${stats.bPercent}%)</span></div>
                    <div class="my-vote-badge">✅ ${votedText}</div>
                </div>
            `;
        } else {
            return `<div class="vote-stats-hidden">🔒 投票后可查看当前票数<br><span style="font-size:12px;">每人限投一票，请谨慎选择！</span></div>`;
        }
    }

    window.likeComment = (id, idx) => {
        const c = cases.find(c => c.id === id);
        if (c && c.comments[idx]) { c.comments[idx].likes++; saveData(); refreshDetail(id); }
    };
    window.addComment = (id) => {
        const ta = document.getElementById(`comment-${id}`);
        if (!ta.value.trim()) return;
        const c = cases.find(c => c.id === id);
        if (c) { c.comments.push({ text: ta.value.trim(), likes: 0 }); ta.value = ''; saveData(); refreshDetail(id); renderCases();}
    };
    window.refreshAIDetail = async (id) => {
        const c = cases.find(c => c.id === id);
        if (c) {
            showLoading("AI裁判重新分析中...");
            await generateAIVerdictForCase(c);
            hideLoading();
            renderCaseDetail(id);
        }
    };
    async function refreshDetail(id) { if (currentDetailCaseId === id) await renderCaseDetail(id); renderCases(); }

    async function renderCaseDetail(id) {
        const c = cases.find(c => c.id === id);
        if (!c) return;
        const stats = getCaseStats(c);
        const hasVoted = hasUserVoted(id);
        const userVotedSide = getUserVotedSide(id);
        if (!c.aiVerdict) { showLoading("AI裁判分析中..."); await generateAIVerdictForCase(c); hideLoading(); }
        const ai = c.aiVerdict || { verdict: "等待分析", suggestion: "" };

        document.getElementById("caseDetailContainer").innerHTML = `
            <div class="card" style="cursor:default;">
                <div class="vs-title">${escapeHtml(c.title)}</div>
                <div class="opinions">
                    <div class="opinion"><div class="role a">🔴 ${escapeHtml(stats.displayA)}</div><div class="text">${escapeHtml(c.sideA.text)}</div></div>
                    <div class="opinion"><div class="role b">🔵 ${escapeHtml(stats.displayB)}</div><div class="text">${escapeHtml(c.sideB.text)}</div></div>
                </div>
                <div class="vote-area">
                    <button class="vote-btn a-vote ${hasVoted ? 'disabled' : ''}" onclick="voteForCase('${c.id}','A')" ${hasVoted ? 'disabled' : ''}>🔥 支持 ${escapeHtml(stats.displayA)}</button>
                    <button class="vote-btn b-vote ${hasVoted ? 'disabled' : ''}" onclick="voteForCase('${c.id}','B')" ${hasVoted ? 'disabled' : ''}>💧 支持 ${escapeHtml(stats.displayB)}</button>
                </div>
                ${renderVoteArea(c, stats, hasVoted, userVotedSide)}
                
                <!-- 分享按钮区域 -->
                <div class="share-buttons">
                    <button class="share-btn" onclick="copyShareLink('${c.id}')">🔗 复制链接分享</button>
                    <button class="share-btn" onclick="copyShareText('${c.id}')">📋 复制文本分享</button>
                </div>
                
                <div class="ai-verdict">
                    <div class="ai-header"><div class="ai-icon">🤖</div><h4>DeepSeek AI 裁判</h4></div>
                    <div class="verdict-text">📜 ${escapeHtml(ai.verdict)}</div>
                    ${ai.suggestion ? `<div class="ai-suggestion">💡 和解建议：${escapeHtml(ai.suggestion)}</div>` : ''}
                    <button class="ai-btn" onclick="refreshAIDetail('${c.id}')">🔄 重新分析</button>
                </div>
                <div class="comment-section">
                    <div>🗣️ 观众劝架区</div>
                    ${(c.comments || []).map((cm, idx) => `<div style="padding:8px 0; border-bottom:0.5px solid #2c2c2c;">💬 ${escapeHtml(cm.text)} <button class="like-btn" onclick="likeComment('${c.id}',${idx})">❤️ ${cm.likes}</button></div>`).join('')}
                    <textarea id="comment-${c.id}" placeholder="写下你的公正建议..."></textarea>
                    <button class="small-btn" onclick="addComment('${c.id}')">✍️ 送出劝架</button>
                </div>
            </div>
        `;
    }

    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])); }

    function renderCases() {
        // 应用筛选：分类 + 搜索关键词
        let filtered = cases.filter(c => {
            if (currentCategory !== "全部" && c.category !== currentCategory) return false;
            if (currentSearchKeyword) {
                return c.title.toLowerCase().includes(currentSearchKeyword.toLowerCase());
            }
            return true;
        });
        
        if (currentSort === "hot") filtered.sort((a,b) => (b.votes.A+b.votes.B) - (a.votes.A+a.votes.B));
        else filtered.sort((a,b) => b.createdAt - a.createdAt);
        
        const container = document.getElementById("caseListContainer");
        if (!filtered.length) {
            if (currentSearchKeyword) {
                container.innerHTML = `<div class="no-results">🔍 没有找到 "${escapeHtml(currentSearchKeyword)}" 相关的擂台<br>试试其他关键词吧</div>`;
            } else {
                container.innerHTML = `<div class="no-results">⚡ 暂无擂台，发起一个吧</div>`;
            }
            return;
        }
        
        container.innerHTML = filtered.map(c => {
            const stats = getCaseStats(c);
            const hasVoted = hasUserVoted(c.id);
            const voteDisplay = hasVoted ? `📊 ${stats.aPercent}% : ${stats.bPercent}%` : `🔒 投票后可见结果`;
            // 高亮搜索关键词
            let displayTitle = c.title;
            if (currentSearchKeyword) {
                const regex = new RegExp(`(${currentSearchKeyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
                displayTitle = c.title.replace(regex, `<mark style="background:#ff7a45; color:black; border-radius:4px; padding:0 2px;">$1</mark>`);
            }
            return `<div class="card" data-id="${c.id}">
                <div class="vs-title">${displayTitle}</div>
                <div class="opinions">
                    <div class="opinion"><div class="role a">🔴 ${escapeHtml(stats.displayA)}</div><div class="text">${escapeHtml(c.sideA.text.substring(0,55))}...</div></div>
                    <div class="opinion"><div class="role b">🔵 ${escapeHtml(stats.displayB)}</div><div class="text">${escapeHtml(c.sideB.text.substring(0,55))}...</div></div>
                </div>
                <div class="stats">${voteDisplay} &nbsp; 💬 ${c.comments?.length || 0}</div>
                <div class="enter-detail">⚡ 查看AI裁判判决 →</div>
            </div>`;
        }).join('');
        
        document.querySelectorAll('.card[data-id]').forEach(el => el.addEventListener('click', (e) => { if(e.target.tagName !== 'BUTTON') openDetail(el.dataset.id); }));
    }

    async function openDetail(id) { 
        currentDetailCaseId = id; 
        document.getElementById("caseDetailPage").classList.add("active"); 
        await renderCaseDetail(id);
        // 更新URL但不刷新页面
        const newUrl = getCaseShareUrl(id);
        window.history.pushState({}, '', newUrl);
    }
    function closeDetail() { 
        document.getElementById("caseDetailPage").classList.remove("active"); 
        currentDetailCaseId = null;
        // 清除URL参数
        const url = new URL(window.location.href);
        url.searchParams.delete('case');
        window.history.pushState({}, '', url);
    }
    function renderCategories() {
        const container = document.getElementById("categoryList");
        container.innerHTML = categoriesList.map(cat => `<div class="cat-item ${currentCategory === cat ? 'active' : ''}" data-cat="${cat}">${cat}</div>`).join('');
        document.querySelectorAll('.cat-item').forEach(el => el.addEventListener('click', () => { currentCategory = el.dataset.cat; renderCategories(); renderCases(); }));
    }
    function bindTabs() { document.querySelectorAll('.tab').forEach(tab => tab.addEventListener('click', () => { currentSort = tab.dataset.sort; document.querySelectorAll('.tab').forEach(t => t.classList.remove('active')); tab.classList.add('active'); renderCases(); })); }
    function showForm() { document.getElementById("createFormPage").classList.add("active"); }
    function hideForm() { document.getElementById("createFormPage").classList.remove("active"); }

    async function submitCase() {
        const title = document.getElementById("caseTitle").value.trim();
        const myRole = document.getElementById("myRole").value.trim() || "我方";
        const myView = document.getElementById("myView").value.trim();
        const oppRole = document.getElementById("opponentRole").value.trim() || "对方";
        const oppView = document.getElementById("opponentView").value.trim();
        if (!title || !myView || !oppView) { alert("请完整填写双方观点"); return; }
        const submitBtn = document.getElementById("submitCaseBtn");
        submitBtn.disabled = true; submitBtn.textContent = "⏳ AI分析中...";
        const newCase = { id: Date.now().toString(), title, category: "其他", hideGender: false, sideA: { role: myRole, text: myView }, sideB: { role: oppRole, text: oppView }, votes: { A:0, B:0 }, comments: [], createdAt: Date.now(), aiVerdict: null };
        cases.unshift(newCase); saveData(); hideForm(); showLoading("AI裁判深度分析中...");
        if (DEEPSEEK_API_KEY && DEEPSEEK_API_KEY !== "YOUR_API_KEY_HERE") await generateAIVerdictForCase(newCase);
        hideLoading(); renderCases(); await openDetail(newCase.id);
        document.getElementById("caseTitle").value = ""; document.getElementById("myView").value = ""; document.getElementById("opponentView").value = "";
        submitBtn.disabled = false; submitBtn.textContent = "🔥 提交 · AI将深度分析";
    }

    // 监听浏览器前进后退
    window.addEventListener('popstate', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const caseId = urlParams.get('case');
        if (caseId && cases.find(c => c.id === caseId)) {
            openDetail(caseId);
        } else {
            closeDetail();
        }
    });

    loadData(); 
    renderCategories(); 
    renderCases(); 
    bindTabs();
    initSearch();  // 初始化搜索
    checkUrlForCase();  // 检查URL参数，自动打开分享的案例
    
    document.getElementById("openCreateModalBtn").addEventListener("click", showForm);
    document.getElementById("closeFormBtn").addEventListener("click", hideForm);
    document.getElementById("closeDetailBtn").addEventListener("click", closeDetail);
    document.getElementById("submitCaseBtn").addEventListener("click", submitCase);
    
    // 将分享函数挂载到window，供onclick调用
    window.copyShareLink = copyShareLink;
    window.copyShareText = copyShareText;
</script>
</body>
